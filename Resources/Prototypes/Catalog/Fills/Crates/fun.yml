- type: entity
  parent: CrateGenericSteel
  id: CratePlants
  name: ящик з рослинами
  description: Різноманітний набір рослин у горщиках, щоб прикрасити вашу станцію! Ти точно не перетворюєшся на свою бабусю.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: AllPottedPlantsTable
        rolls: !type:ConstantNumberSelector
          value: 5

- type: entity
  parent: CrateGenericSteel
  id: CrateFunPlushie
  name: ящик з плюшевими іграшками
  description: Купа м'яких плюшевих іграшок. Ну чи не прекрасні вони? Не забудьте придумати гарну причину, чому ви їх замовили.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: AllPlushiesTable
        rolls: !type:ConstantNumberSelector
          value: 10

- type: entity
  parent: CrateGenericSteel
  id: CrateFunLizardPlushieBulk
  name: оптовий ящик з плюшевими ящірками
  description: Купа м'яких плюшевих ящірок. Ну чи не прекрасні вони? Не забудьте придумати гарну причину, чому ви їх замовили. Вех!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: AllLizardPlushieTable
        rolls: !type:ConstantNumberSelector
          value: 6

- type: entity
  parent: CrateGenericSteel
  id: CrateFunSharkPlushieBulk
  name: оптовий ящик з плюшевими акулками
  description: Ящик наповнений вашими улюбленими акулками всіх можливих кольорів. Равр!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: PlushieSharkBlue
          amount: !type:ConstantNumberSelector
            value: 2
        - id: PlushieSharkPink
          amount: !type:ConstantNumberSelector
            value: 2
        - id: PlushieSharkGrey
          amount: !type:ConstantNumberSelector
            value: 2

- type: entity
  parent: CrateGenericSteel
  id: CrateFunArtSupplies
  name: ящик з художнім приладдями
  description: Покажіть свій внутрішній світ (сподіваємося в ньому є щось крім вандалізму) всім за допомогою ящику крейди!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: CrayonBox

- type: entity
  parent: CrateGenericSteel
  id: CrateFunBoardGames
  name: ящик з настільними іграми
  description: Доведено, що ігрові вечори з гарною компанією або зменшують нудьгу, або посилюють жагу до вбивства. Все залежить від гри та компанії!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ChessBoard
        - id: BackgammonBoard
        - id: ParchisBoard
        - id: CheckerBoard
        - id: ShipBattlemap
        - id: SnowBattlemap
        - id: SandBattlemap
        - id: MoonBattlemap
        - id: GrassBattlemap
        - id: DiceBag
          amount: 6
        - id: PaperCNCSheet
          amount: 6

- type: entity
  parent: CrateGenericSteel
  id: CrateFunSadTromboneImplants
  name: ящик з імплантами сумного тромбона
  description: Смерть ще ніколи не була такою веселою та одночасно драматичною! Імплантуйте собі це, щоб зробити вмирання трохи комічнішим.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: SadTromboneImplanter
        amount: 3

- type: entity
  parent: CrateGenericSteel
  id: CrateFunLightImplants
  name: ящик з імплантами лампи
  description: Освітіть свою шкіру та шлях попереду за допомогою цих імплантів. Але не перестарайтеся, аби не знайти себе обліпленими ніанами!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: LightImplanter
        amount: 3

