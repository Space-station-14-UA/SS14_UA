# Musical Instruments

- type: entity
  parent: CrateGenericSteel
  id: CrateFunInstrumentsVariety
  name: ящик з різноманітними інструментами
  description: Розворушіть та змусьте танцювати свою сумну та тиху станцію з цим універсальним набором! Містить сім різних інструментів.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SynthesizerInstrument
        - id: AcousticGuitarInstrument
        - id: TrumpetInstrument
        - id: AccordionInstrument
        - id: HarmonicaInstrument
        - id: RecorderInstrument
        - id: GlockenspielInstrument

- type: entity
  parent: CrateGenericSteel
  id: CrateFunInstrumentsBrass
  name: ящик з латунними духовими інструментами
  description: Принесіть трохи джазу на станцію з цим ансамблем. Містить всі можливі духові інструменти. "What a wonderful woooorld~"
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: TrumpetInstrument
        - id: TromboneInstrument
        - id: FrenchHornInstrument
        - id: EuphoniumInstrument

- type: entity
  parent: CrateGenericSteel
  id: CrateFunInstrumentsString
  name: ящик з струнними інструментами
  description: Щипайте чи бийте, ляпайте чи ріжте ці прекрасні струни! Розтопіть серце коханої вам людини або влаштуйте рок-концерт за допомогою цього набору струнних інструментів!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: AcousticGuitarInstrument
        - id: ElectricGuitarInstrument
        - id: BassGuitarInstrument
        - id: RockGuitarInstrument
        - id: BanjoInstrument
        - id: ViolinInstrument
        - id: CelloInstrument
        - id: ViolaInstrument

- type: entity
  parent: CrateGenericSteel
  id: CrateFunInstrumentsWoodwind
  name: ящик з дерев'яними духовими інструментами
  description: Якщо атмоси добре справляються зі своєю роботою, то чому ж не використати повітря для музики! Справжнє дерево не гарантується у кожному виробі.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: RecorderInstrument
        - id: BagpipeInstrument
        - id: ClarinetInstrument
        - id: FluteInstrument
        - id: HarmonicaInstrument
        - id: OcarinaInstrument
        - id: PanFluteInstrument
        - id: SaxophoneInstrument # although made out of brass, they are classified as woodwind instrument

- type: entity
  parent: CrateGenericSteel
  id: CrateFunInstrumentsKeyedPercussion
  name: ящик з клавішними та ударними інструментами
  description: Вдарте по прекрасних клавішах паличками чи навіть власними пальцями! Цей набір дозволить вам це.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SynthesizerInstrument
        - id: AccordionInstrument
        - id: KalimbaInstrument
        - id: WoodblockInstrument
        - id: GlockenspielInstrument
        - id: XylophoneInstrument

- type: entity
  parent: CrateGenericSteel
  id: CrateFunInstrumentsSpecial
  name: спеціальний ящик з колекційними інструментами
  description: Створіть трохи мистецтва з цією особливою колекцією інструментів, які, можливо, будуть грати! Центральне Командування не несе відповідальності за фізичні (та психолоічні) травми, спричинені використанням цих виробів.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BikeHornInstrument
        - id: MusicBoxInstrument
        - id: SeashellInstrument
        - id: GunpetInstrument
        - id: HelicopterInstrument
        - id: BirdToyInstrument
        - id: MusicalLungInstrument
        - id: ReverseCymbalsInstrument
        - id: CannedApplauseInstrument
        - id: MicrophoneInstrument

- type: entity
  parent: CrateGenericSteel
  id: CrateFunInstrumentsRandom
  name: ящик з випадковими інструментами
  description: Ящик, який містить кілька випадково підібраних інструментів. Відібрано найкращими музикантами Центрального Командування!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: VarietyInstrumentTable # 200 speso max
        - !type:NestedSelector
          tableId: BrassInstrumentTable # 300 speso max
        - !type:NestedSelector
          tableId: StringInstrumentTable # 300 speso max
        - !type:NestedSelector
          tableId: WoodwindInstrumentTable # 200 speso max
        - !type:NestedSelector
          tableId: KeyedPercussionInstrumentTable # 300 speso max
        - !type:NestedSelector
          tableId: SpecialInstrumentTable # x2 200 speso max
          rolls: 2

