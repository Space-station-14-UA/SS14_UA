- type: entity
  parent: CrateSecgear
  id: CrateEmergencyExplosive
  name: ящик з комплектом сапера
  description: Науковці знову збожеволіли? Щось вже пищить прямо за шлюзом вашого відділу? Купуйте зараз і станьте героєм, якого не заслужила, але потребує ця станція! (час в комплект не входить)
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingHeadHelmetBombSuit
        - id: ClothingMaskGas
        - id: Screwdriver
        - id: Wirecutter
        - id: Multitool
        - id: ClothingOuterSuitBomb

- type: entity
  parent: CrateGenericSteel
  id: CrateEmergencyFire
  name: ящик з пожежним обладнанням
  description: Тільки ти можеш запобігти пожежам на станції. Використовуй ці два пожежних костюма, протигази, ліхтарики, велькі кисневі балони, вогнегасники та каски! Врятуй всіх пухнастих членів екіпажу.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: FlashlightLantern
          amount: 2
        - id: FireExtinguisher
          amount: 2
        - id: ClothingHeadHatHardhatRed
          amount: 2
        - id: ClothingMaskGas
          amount: 2
        - id: ClothingOuterSuitFire
          amount: 2
        - id: OxygenTankFilled
          amount: 2

- type: entity
  parent: CrateInternals
  id: CrateEmergencyEVA
  name: emergency pressure suit crate
  description: For when the crew needs mass atmospheric protection on a budget. Contains six breath masks, six emergency pressure suits, six oxygen tanks, and six nitrogen tanks.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingMaskBreath
          amount: 6
        - id: OxygenTankFilled
          amount: 6
        - id: NitrogenTankFilled
          amount: 6
        - id: ClothingOuterSuitEmergency
          amount: 6

- type: entity
  parent: CrateRadiation
  id: CrateEmergencyRadiation
  name: radiation protection crate
  description: Survive the nuclear apocalypse! Or, the nuclear part, anyway. Contains two radiation suits and two Geiger counters.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterSuitRad
          amount: 2
        - id: GeigerCounter
          amount: 2

- type: entity
  parent: CratePlastic
  id: CrateEmergencyInflatablewall
  name: ящик з надувними стінами
  description: Два комплекти надувних стін та стільки ж комплектів надувних дверей на випадок, коли металеві стіни станцій більше не захочуть утримувати атмосферу.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BoxInflatable

- type: entity
  parent: CratePlastic
  id: CrateGenericBiosuit
  name: екстрений ящик з костюмами біозахисту
  description: Містить у собі 2 костюми біологічного захисту, щоб жодна хвороба чи калюжа хімікатів не відволікала вас від того, що ви там робите.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: FillBiohazardGearGeneric
          rolls: 2
        - id: ClothingMaskGas
          amount: 2
