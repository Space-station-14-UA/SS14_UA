- type: entity
  parent: CrateGenericSteel
  id: CrateServiceSmokeables
  name: ящик з куривом
  description: Втомилися від швидкої смерті на станції? Замовте цей ящик й пришвидшити процес! "Я б пройшов милю заради цигарки." Заборонено продаж особам молодшим за 18 років, а також вкрай не рекомендується до вживання вагітним жінкам, людям з серцевими захворюваннями, астмою або будь-якими іншими респіраторними захворюваннями.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:GroupSelector
          children:
          - id: CigCartonGreen
            weight: 0.50
          - id: CigCartonRed
        - !type:GroupSelector
          children:
          - id: CigCartonBlue
            weight: 0.50
          - id: CigCartonBlack
        - !type:GroupSelector
          children:
          - id: CigarGoldCase
            weight: 0.05
          - id: CigarCase
        - id: Matchbox
          amount: 2

- type: entity
  parent: CrateGenericSteel
  id: CrateServiceTheatre
  name: ящик з театральним приладдям
  description: "Містить плащ молі, ножиці перукаря, форму покоївки, атрибути клоуна та міма, а також інші штуки для виступу. Пам'ятайте: \"Весь світ - це театр, а люди в ньому - актори.\""
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BarberScissors
        - id: ClothingOuterSuitMonkey
        - id: ClothingHeadHatAnimalMonkey
        - id: ClothingUniformJumpskirtJanimaid
        - id: ClothingUniformJumpskirtOldDress
        - id: ClothingHeadHatMagician
        - !type:AllSelector # Cloaks
          children:
          - id: ClothingNeckCloakMoth
          - id: ClothingNeckCloakVoid
        - !type:AllSelector # Clown starter kit
          children:
          - id: ClothingMaskClown
          - id: ClownRecorder
          - !type:GroupSelector
            children:
            - id: ClothingShoesClown
            - id: ClothingShoesClownLarge
              weight: 0.1
          - !type:NestedSelector
            tableId: RandomBikeHornTable
        - !type:AllSelector # Mime starter kit
          children:
          - id: ClothingMaskMime
          - id: ClothingBeltSuspendersRed
          - id: ClothingBeltSuspendersBlack
        - !type:AllSelector # Performer starter kit
          children:
          - id: ClothingUniformJumpskirtPerformer
          - id: ClothingShoesBootsPerformer
          - id: ClothingHeadPerformerWig

- type: entity
  parent: CrateGenericSteel
  id: CrateServiceCustomSmokable
  name: ящик з куривом "Зроби це сам"
  description: Хочете проявити трохи креативності з тим, що ви використовуєте, щоб знищити свої легені? Тоді цей ящик для вас! У ньому є все необхідне, щоб крутити цигарки самостійно. Заборонено продаж особам молодшим за 18 років, а також вкрай не рекомендується до вживання вагітним жінкам, людям з серцевими захворюваннями, астмою або будь-якими іншими респіраторними захворюваннями.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: PackPaperRolling
        - id: CigaretteFilter
          amount: 8
        - id: GroundTobacco
          amount: 4
        - id: SmokingPipe
        - id: Matchbox

