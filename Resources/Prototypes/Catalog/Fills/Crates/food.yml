- type: entity
  parent: CratePlastic
  id: CrateFoodPizza
  name: екстрена доставка піци
  description: Допоможіть подолати голод на станції, роздавши піцу недофінансованим відділам! У комплект входить 4 піци, одна з яких гарантована спілкою з захисту прав Ніан.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: FoodBoxPizzaFilled
          amount: 3
        - id: FoodBoxPizzaCotton
        - id: LidSalami
          prob: 0.01

- type: entity
  parent: CratePlastic
  id: CrateFoodMRE
  name: ящик з сухпаєм
  description: Їжа у стилі військових, здатна нагодувати цілий відділ. Не дивіться на термін придатності.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BoxMRE
        amount: 6

