        - id: DrinkRootBeerCan
          amount: 2
        - id: DrinkIcedTeaCan
          amount: 2
        - id: DrinkLemonLimeCan
          amount: 2
        - id: DrinkLemonLimeCranberryCan
          amount: 2
        - id: DrinkFourteenLokoCan
          amount: 2

