- type: entity
  parent: BaseAction
  id: ActionMRMouseSense
  name: Чуття на мишей
  description: Вроджене чуття фелінідів дозволяє відчути присутність мишей на короткий проміжок часу в невеликому радіусі. Працює навіть через стіни.
  components:
  - type: Action
    useDelay: 60
  - type: Sprite
    layers:
    - texture: Interface/Actions/eyeopen.png
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:MouseSenseActionEvent
