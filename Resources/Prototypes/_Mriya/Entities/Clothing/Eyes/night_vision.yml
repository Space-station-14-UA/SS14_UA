- type: entity
  parent: [ClothingEyesBase, BaseSecurityContraband]
  id: MRClothingEyesNightVisionSecurity
  name: службовий ПНБ
  description: Прилад нічного бачення — оптичний прилад, що слугує для отримання у темряві видимого зображення об'єктів та місцевості. Призначений для виявлення, розпізнавання та спостереження цілей за умов пониженого або відсутнього освітлення.
  components:
  - type: Sprite
    sprite: _Mriya/Clothing/Eyes/Glasses/security_nightvision.rsi
  - type: Clothing
    sprite: _Mriya/Clothing/Eyes/Glasses/security_nightvision.rsi
  - type: NightVision
    enabled: false
    relayOverlay: true
    action: MRActionToggleNightVision
    lightingColor: "#FF1010AA"
    overlayColor: "#FF101066"
    noiseAmount: 0.1
    noiseMultiplier: 1
  - type: Tag
    tags:
    - WhitelistChameleon

- type: entity
  parent: [ClothingEyesBase, BaseSyndicateContraband]
  id: MRClothingEyesNightVisionBlood
  name: кривавий ПНБ
  description: Прилад нічного бачення, розроблений на основі запозичених зразків. Заливає темряву криваво-алим світлом, але не захищає очі від спалахів.
  components:
  - type: Sprite
    sprite: _Mriya/Clothing/Eyes/Glasses/blood_nightvision.rsi
  - type: Clothing
    sprite: _Mriya/Clothing/Eyes/Glasses/blood_nightvision.rsi
  - type: NightVision
    enabled: false
    relayOverlay: true
    action: MRActionToggleNightVision
    lightingColor: "#FF2400AA"
    overlayColor: "#B00000AA"
    noiseAmount: 0.1
    noiseMultiplier: 1
  - type: Tag
    tags:
    - WhitelistChameleon
