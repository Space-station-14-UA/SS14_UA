- type: entity
  name: пакет олії
  description: Містить у собі олію для ІПШ, аби замінювати при її недостачі.
  parent: BaseHealingItem
  id: MROilpack
  suffix: Повний
  components:
  - type: Item
    heldPrefix: oilpack
  - type: Tag
    tags:
    - Bloodpack
  - type: Sprite
    state: bloodpack
  - type: Healing 
    delay: 2
    damageContainers:
      - Silicon
      - IPC
    damage:
      types:
        Heat: -10
    modifyBloodLevel: 15 #restores about 5% blood per use on standard humanoids.
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: MROilpack
    count: 10
  - type: StackPrice
    price: 10
    
- type: entity
  parent: MROilpack
  id: MROilpack1
  suffix: Single
  components:
  - type: Stack
    stackType: MROilpack
    count: 1
    
- type: entity
  name: металева латка
  description: Металева латка аби закрити дірки у корпусі ІПШ, та тим самим зупинити витікання олії.
  parent: BaseHealingItem
  id: MRIPCRepairKit
  suffix: Повний
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    state: medicated-suture
  - type: Item
    heldPrefix: medicated-suture
    storedRotation: -90
  - type: Healing 
    delay: 1.5
    damageContainers:
      - Silicon
      - IPC
    damage:
      types:
        Blunt: -5
        Piercing: -5
        Slash: -5
    bloodlossModifier: -10 # a suture should stop ongoing bleeding
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: MRIPCRepairKit
    count: 10
  - type: StackPrice
    price: 20