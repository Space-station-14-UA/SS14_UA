- type: entity
  parent: BaseStructure
  id: MRPamyiatnykSvyni
  name: пам'ятник свині
  description: |-
    А це пам'ятник свині!
    "Одвічній годувальниці українського народу"
  components:
  - type: Sprite
    sprite: _Mriya/Structures/Decoration/pig_monument.rsi
    state: icon
    drawdepth: Mobs
    noRot: true
    offset: "0.0,0.5"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.55,-0.25,0.55,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Construction
    graph: MRPamyiatnykSvyniGraph
    node: monument
  - type: Damageable
    damageModifierSet: RockMod
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 3
          IngotGold1:
            min: 1
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
