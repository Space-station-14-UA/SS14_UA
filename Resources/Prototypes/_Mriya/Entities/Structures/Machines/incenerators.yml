  name: середній спалювач
  description: Доволі великий спалювач який вже здатен спалювати більше ефективно вироблюючи більше тепла у атмосферу, за одницю палива. Викидує 30 000 Джоулів енерії у атмосферу.
  components:
  - type: Sprite
    sprite: Structures/Machines/protolathe.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: MaterialStorage
    whitelist:
      tags:
        - Incenerateble
  - type: Lathe
    producingSound: /Audio/_Mriya/Ambience/Machinery/electric-furnace.ogg
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - MRInceneration
  - type: LatheHeatProducing
    energyPerSecond: 30000
    
