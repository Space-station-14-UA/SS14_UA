- type: entity
  id: BureaucracyComputer
  name: "Комп'ютер бюрократії"
  description: "Комп'ютер для бюрократії!"
  parent: BaseComputerAiAccess
  components:
  - type: BureaucracyComputer
  - type: UserInterface
    interfaces:
      enum.Content.Shared._Mriya.BureaucraticComputer.BureaucracyUiKey.Key:
        type: BureaucracyComputerBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: alert-0
    - map: ["computerLayerKeys"]
      state: atmos_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }

