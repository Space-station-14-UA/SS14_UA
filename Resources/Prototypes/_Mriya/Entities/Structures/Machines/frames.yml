
#генератори

- type: entity
  id: MRStirlingGeneratorFrameCoal
  name: рама двигуна стірлінга на вугіллі
  description: двигун стірлінга практично побудований.
  suffix: Незавершене
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.5,0.25,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Rotatable
  - type: Pullable
  - type: Construction
    containers:
      - machine_board
      - machine_parts
    graph: MRStirlingGeneratorCoal
    node: stirlingframe
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: _Mriya/Structures/Power/Generetion/stirling_generator.rsi
    state: stirling_frame
    snapCardinals: true
    noRot: true
    
- type: entity
  parent: MRStirlingGeneratorFrameCoal
  id: MRStirlingGeneratorFrameWood
  name: рама двигуна стірлінга на дереві
  description: двигун стірлінга практично побудований.
  suffix: Незавершене
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction
    containers:
      - machine_board
      - machine_parts
    graph: MRStirlingGeneratorWood
    node: stirlingframe




