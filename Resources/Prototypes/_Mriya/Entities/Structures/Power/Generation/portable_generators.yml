- type: entity
  abstract: true
  id: MRSimpleGeneratorBase
  parent: [ BaseMachine, StructureWheeled]
  components:
  # Basic properties
  - type: Transform
    anchored: False
  - type: Physics
    bodyType: Dynamic
  - type: StaticPrice
    price: 500
  - type: AmbientSound
    range: 5
    volume: -2 #гучний бо зібраний з чого попало
    sound:
      path: /Audio/_Mriya/Ambience/Machinery/assembling-machine-t1-2.ogg
    enabled: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,-0.40,0.40,0.40"
        # Despite the heavy weight, it has wheels, so it's still fairly portable.
        density: 155
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: RequireProjectileTarget

  # Visuals
  - type: Appearance
  - type: Sprite
    sprite: Structures/Power/Generation/portable_generator.rsi
    noRot: true

  # Construction, interaction
  - type: UserInterface
    interfaces:
      enum.GeneratorComponentUiKey.Key:
        type: PortableGeneratorBoundUserInterface
  - type: ActivatableUI
    key: enum.GeneratorComponentUiKey.Key
  - type: Electrified
    onHandInteract: false
    onInteractUsing: false
    onBump: false
    requirePower: true
    highVoltageNode: output

  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: GuideHelp
    guides:
    - PortableGenerator
    - Power

    # Core functionality
  - type: PortableGenerator
    startSoundEmpty: { collection: MRStirlingStart }
    startSound: { collection: MRStirlingStart }
  - type: FuelGenerator
  - type: PowerSupplier
    supplyRate: 3000
    supplyRampRate: 500
    supplyRampTolerance: 500
    enabled: false
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle
  - type: GeneratorSignalControl
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200

- type: entity
  abstract: true
  parent: MRSimpleGeneratorBase
  id: MRSimpleGeneratorSwitchableBase
  components:
  - type: PowerSwitchable
    examineText: power-switchable-generator-examine
    switchText: power-switchable-generator-switched
    cables:
    - voltage: HV
      node: output_hv
    - voltage: MV
      node: output_mv
    - voltage: LV
      node: output_lv
  - type: UseDelay
    delay: 1
  - type: NodeContainer
    examinable: true
    nodes:
      output_hv:
        !type:CableDeviceNode
        nodeGroupID: HVPower
        enabled: false
      output_mv:
        !type:CableDeviceNode
        nodeGroupID: MVPower
        enabled: false
      output_lv:
        !type:CableDeviceNode
        nodeGroupID: Apc

- type: entity
  name: генератор Стирлінга на вугіллі
  description: Простий генератор стирлінга який був збудований з подручних матеріалів, та працює на вугіллі. Здатен виробляти до 8 кВт.
  parent: MRSimpleGeneratorSwitchableBase
  id: MRStirlingEngineCoal
  suffix: Вугілля 8 kW
  components:
    - type: Sprite
      layers:
        - state: portgen0
          map: [ "enum.GeneratorVisualLayers.Body" ]
        - state: portgen_on_unlit
          map: [ "enum.GeneratorVisualLayers.Unlit" ]
          shader: unshaded
          visible: false
    - type: GenericVisualizer
      visuals:
        enum.GeneratorVisuals.Running:
          enum.GeneratorVisualLayers.Body:
            True: { state: portgen0on }
            False: { state: portgen0 }
          enum.GeneratorVisualLayers.Unlit:
            True: { visible: true }
            False: { visible: false }

    - type: FuelGenerator
      minTargetPower: 1000
      maxTargetPower: 8000
      targetPower: 8000
      optimalPower: 8000
      # 15 minutes at max output
      optimalBurnRate: 0.0333333
      fuelEfficiencyConstant: 0.75
    - type: SolidFuelGeneratorAdapter
      fuelMaterial: Coal
      multiplier: 0.01
    - type: MaterialStorage
      storageLimit: 3000
      materialWhiteList: [Coal]
    - type: PortableGenerator
      startChance: 0.7
    - type: GeneratorExhaustGas
      gasType: CarbonDioxide
      #чотири молі вугликислого газу за кусок вугілля.
      moleRatio: 4
      temperature: 200
    - type: PowerMonitoringDevice
      group: Generator
      loadNodes:
        - output_lv
        - output_hv
        - output_mv
      sprite: Structures/Power/Generation/portable_generator.rsi
      state: portgen0
    - type: PowerSupplier
      supplyRampRate: 5000
      supplyRampTolerance: 1500

- type: entity
  name: генератор Стирлінга на деревені
  description: Простий генератор стирлінга який був збудований з подручних матеріалів, та працює на деревені. Здатен виробляти до 8 кВт.
  parent: MRStirlingEngineCoal
  id: MRStirlingEngineWood
  suffix: Дерево 8 kW
  components:
    - type: SolidFuelGeneratorAdapter
      fuelMaterial: Wood
      multiplier: 0.01
    - type: MaterialStorage
      storageLimit: 3000
      materialWhiteList: [Wood]