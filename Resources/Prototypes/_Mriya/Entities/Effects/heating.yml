# тут еффекти аби нагрівати повітря

- type: entity
  id: MRBaseHeatingEffect
  name: нагріти повітря
  suffix: нагріває повітря
  abstract: true 
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/Portable/portable_sheater.rsi
    noRot: true
    layers:
    - state: sheaterOff
      map: ["enum.SpaceHeaterVisualLayers.Main"]
    - state: sheaterPanelOpen
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: UserInterface
    interfaces:
      enum.SpaceHeaterUiKey.Key:
        type: SpaceHeaterBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: false
    key: enum.SpaceHeaterUiKey.Key
  - type: SpaceHeater
    maxTemperature: 1317
    minTemperature: 1316
    mode: Heat
    powerLevel: Low
  - type: GasThermoMachine
    targetTemperature: 1317
    temperatureTolerance: 0.1
    atmospheric: true
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: TimedDespawn
    lifetime: 60
  - type: ApcPowerReceiver
    
- type: entity
  id: MRWoodHeating
  parent: MRBaseHeatingEffect
  name: нагріти повітря
  suffix: нагріває повітря (дерево)
  components:
  - type: SpaceHeater
    maxTemperature: 973
    minTemperature: 972
    mode: Heat
    powerLevel: Low
  - type: GasThermoMachine
    targetTemperature: 973
    temperatureTolerance: 0.1
    atmospheric: true
    
- type: entity
  id: MRCoalHeating
  parent: MRBaseHeatingEffect
  name: нагріти повітря
  suffix: нагріває повітря (вугілля)
  components:
  - type: SpaceHeater
    maxTemperature: 1373
    minTemperature: 1372
    mode: Heat
    powerLevel: Low
  - type: GasThermoMachine
    targetTemperature: 1373
    temperatureTolerance: 0.1
    atmospheric: true
