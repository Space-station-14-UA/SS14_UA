- type: constructionGraph
  id: MRStirlingGeneratorCoal
  start: start
  graph:
    - node: start
      actions:
        - !type:SpawnPrototype
          prototype: SheetSteel1
        - !type:DeleteEntity
      edges:
        - to: stirlingframe
          completed:
            - !type:SetAnchor
              value: false
          steps:
            - material: Steel
              amount: 10
              doAfter: 2.5
            - material: MetalRod
              amount: 2
              doAfter: 2

    - node: stirlingframe
      entity: MRStirlingGeneratorFrame
      actions:
        - !type:EmptyAllContainers
      edges:
        - to: stirlingcoal
          conditions:
            - !type:EntityAnchored
          steps:
            - material: Cable
            - tool: Screwing
              doAfter: 2
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 10
            - !type:SpawnPrototype
              prototype: MetalRod1
              amount: 2
            - !type:DeleteEntity
          steps:
            - tool: Welding
              doAfter: 2
 
    - node: stirlingcoal
      entity: MRStirlingEngineCoal
      actions:
        - !type:EmptyAllContainers
      edges:
        - to: stirlingframe
          completed:
            - !type:SpawnPrototype
              prototype: CableApcStack1
            - !type:RaiseEvent
              event: !type:MachineDeconstructedEvent
              broadcast: false
          steps:
            - tool: Prying
              doAfter: 5
              
