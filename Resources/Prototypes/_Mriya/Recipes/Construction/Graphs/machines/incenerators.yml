- type: constructionGraph
  id: MRSmallIncenerator
  start: start
  graph:
    - node: start
      actions:
        - !type:SpawnPrototype
          prototype: SheetSteel1
        - !type:DeleteEntity
      edges:
        - to: smallinceneratorframe
          completed:
            - !type:SetAnchor
              value: false
          steps:
            - material: Steel
              amount: 10
              doAfter: 2.5

    - node: smallinceneratorframe
      entity: MRSmallInceneratorFrame
      actions:
        - !type:EmptyAllContainers
      edges:
        - to: smallincenerator
          conditions:
            - !type:EntityAnchored
          steps:
            - tool: Screwing
              doAfter: 2
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 10
            - !type:DeleteEntity
          steps:
            - tool: Welding
              doAfter: 2
 
    - node: smallincenerator
      entity: MRInceneratorSmall
      actions:
        - !type:EmptyAllContainers
      edges:
        - to: smallinceneratorframe
          completed:
            - !type:RaiseEvent
              event: !type:MachineDeconstructedEvent
              broadcast: false
          steps:
            - tool: Prying
              doAfter: 5
              
