# Алкоголь тє файно. ТАКОЖ ВАЖЛИВА РЕМАРКА! ПІСЛЯ ОНОВЛЕННЯ КУЛІНАРІЇ - ТО ВИДАЛИТИ!
- type: entity
  name: пивна піца
  parent: [FoodPizzaBase, BaseSlicingRefinableFood]
  id: FoodPizzaBeer
  description: У цій піці є пиво. Вітаємо – ви щойно стали найкращим другом інженерів.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - salty
      - oily
      - beer
  - type: Sprite
    sprite: _Sich/Objects/Consumable/Food/pizza.rsi
    layers:
    - state: beer-pizza
  - type: ToolRefinable
    refineResult:
    - id: FoodPizzaBeerSlice
      amount: 8
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 100
      - ReagentId: Beer
        Quantity: 20

- type: entity
  name: шматок пивної піци
  parent: FoodPizzaSliceBase
  id: FoodPizzaBeerSlice
  description: У цьому шматочку піци є пиво. Вітаємо – ви щойно стали найкращим другом інженерів.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - salty
      - oily
      - beer
  - type: Sprite
    sprite: _Sich/Objects/Consumable/Food/pizza.rsi
    layers:
    - state: beer-slice
  - type: Item
    heldPrefix: beer-slice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Beer
        Quantity: 2

