- type: entity
  abstract: true
  parent: BaseAmmoProvider
  id: AmmoProviderSmallGrenades
  components:
    - type: Sprite
      sprite: _Sich/Objects/Weapons/Guns/Ammunition/boxes/small_grenade_box.rsi
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
        - SmallGrenade
      capacity: 6
    - type: MagazineVisuals
      magState: mag
      steps: 7
      zeroVisible: false
    - type: Appearance

- type: entity
  parent: AmmoProviderSmallGrenades
  id: BoxGrenadesFlash
  name: коробка світло-шумових гранат
  description: Картонна коробка світло-шумових гранат для гранатомета.
  components:
    - type: BallisticAmmoProvider
      proto: SmallGrenadeFlash
    - type: MagazineVisuals
      magState: mag
      steps: 7
      zeroVisible: false
    - type: Sprite
      layers:
      - state: base_flash
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: flash

