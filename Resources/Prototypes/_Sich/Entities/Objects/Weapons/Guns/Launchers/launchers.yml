- type: entity
  parent: WeaponTetherGun
  id: SichPoltergeistWeaponTetherGun
  name: містичний контроль
  description: ти можеш за допомогою цього переміщювати об'єкти
  suffix: полтергейст
  components:
    - type: TetherGun
      maxForce: 10000
      massLimit: 10000
      dampingRatio: 4
      frequency: 20
    - type: Sprite
      sprite: _Sich/Objects/Weapons/Guns/Launchers/poltergeist_tether_force.rsi
      layers:
        - state: base
        - state: base-unshaded
          map: [ "unshaded" ]
          shader: unshaded
          visible: false
    - type: ToggleableVisuals
      spriteLayer: unshaded
      inhandVisuals:
        left:
          - state: inhand-left-unshaded
            shader: unshaded
        right:
          - state: inhand-right-unshaded
            shader: unshaded
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.TetherVisualsStatus.Key:
          unshaded:
            True: { visible: true }
            False: { visible: false }

- type: entity
  parent: WeaponForceGun
  id: SichPoltergeistWeaponForceGun
  name: містична сила
  description: ти можеш за допомогою цього кидати об'єкти
  suffix: полтергейст
  components:
    - type: ForceGun
      maxForce: 1000
      massLimit: 10000
      frequency: 15
      dampingRatio: 4
      throwForce: 50
      throwDistance: 100
      lineColor: "#18a2d5"
      soundLaunch:
        path: /Audio/Weapons/soup.ogg
        params:
          volume: 2
    - type: Sprite
      sprite: _Sich/Objects/Weapons/Guns/Launchers/poltergeist_throw_force.rsi
      layers:
        - state: base
        - state: base-unshaded
          map: [ "unshaded" ]
          shader: unshaded
          visible: false
    - type: ToggleableVisuals
      spriteLayer: unshaded
      inhandVisuals:
        left:
          - state: inhand-left-unshaded
            shader: unshaded
        right:
          - state: inhand-right-unshaded
            shader: unshaded
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.TetherVisualsStatus.Key:
          unshaded:
            True: { visible: true }
            False: { visible: false }

- type: entity
  name: гіндар
  parent: [BaseWeaponLauncher, BaseSecurityContraband]
  id: MRWeaponLauncherGindar
  description: Гранатомет який може помістити собі дві гранати, та має простий приціл. Розроблений для придушення бунтів, але може бути використаний, і для бою, з відповідними гранатами.
  components:
  - type: Sprite
    sprite: _Sich/Objects/Weapons/Guns/Launchers/grindar.rsi
    layers:
      - state: icon
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Sich/Objects/Weapons/Guns/Launchers/grindar.rsi
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Huge
    shape:
    - 0,0,4,2
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2
  - type: Gun
    fireRate: 0.75
    projectileSpeed: 25
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
  - type: AmmoCounter
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - MRSmallGrenade
    capacity: 2
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: GunRequiresWield
  - type: StaticPrice
    price: 1000
