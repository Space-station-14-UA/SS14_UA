- type: entity
  abstract: true
  parent: BaseItem
  id: BaseSoundPlayer
  name: програвач звуку
  description: грає звуки.
  suffix: полтергейст
  components:
  - type: UseDelayOnTrigger
  - type: UseDelayTriggerCondition # prevent spam
  - type: TriggerOnActivate
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: Speech
    speechSounds: Pai
  - type: UseDelay
    delay: 10
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Machines/Nuke/nuke_alarm.ogg
      params:
        volume: -5
        maxDistance: 10

- type: entity
  parent: BaseSoundPlayer
  id: ScaryMaintenceSoundPlayer
  name: звуки залаштунків
  description: Відтворіть звуки залаштунків.
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    state: passenger_greytide
  - type: UseDelay
    delay: 40
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Ambience/maintambience.ogg
      params:
        volume: 3
        maxDistance: 50

- type: entity
  parent: BaseSoundPlayer
  id: DangerSoundPlayer
  name: звуки небезпеки
  description: Відтворіть звуки, що змусять шкіру живих покритися сиротами.
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    state: footsoldier
  - type: UseDelay
    delay: 16
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Ambience/ambidanger.ogg
      params:
        volume: 3
        maxDistance: 50

- type: entity
