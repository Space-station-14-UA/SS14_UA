
- type: entity
  parent: [MobElementalBase, MobPolymorphable, FlyingMobBase]
  id: SichMobPoltergeist
  name: В•≠§£Ѓ
  description: ±≤∞†Є≠Ѓ Ґ®∞≥°†©.
  suffix: полтергейст
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: poltergeist
      sprite: _Sich/Mobs/NPCs/poltergeist.rsi
    - state: poltergeist_e
      sprite: _Sich/Mobs/NPCs/poltergeist.rsi
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: poltergeist_l
      sprite: _Sich/Mobs/NPCs/poltergeist.rsi
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: poltergeist-moving
    noMovementLayers:
      movement:
        state: poltergeist
  - type: DamageStateVisuals
    states:
      Alive:
        Base: poltergeist
      Critical:
        Base: poltergeist_dead
      Dead:
        Base: poltergeist_dead
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
        requireInputValidation: false
  - type: Damageable
    damageContainer: ManifestedSpirit
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.1
        Caustic: -0.1
        Cold: -0.1
        Shock: -0.1
        Blunt: -0.1
        Piercing: -0.1
        Slash: -0.1
  - type: MovementSpeedModifier
    baseWalkSpeed : 4
    baseSprintSpeed : 5
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Magic/Eldritch/voidblink.ogg
    damage:
      types:
        Asphyxiation: 10
        Cold: 5
  - type: ActionGrant
    actions:
    - ActionBlink
    - ActionPolymorphPoltergeistJaunt
#    - ActionPoltergeistShop
#  - type: Store
#    categories:
#    - PoltergeistAbilities
#    currencyWhitelist:
#    - PoltergeistEssence
#    balance:
#      PoltergeistEssence: 30
  - type: IgnoreSpiderWeb
  - type: Examiner
  - type: DoAfter
  - type: Alerts
  - type: Actions
  - type: Eye
  - type: ContentEye
  - type: CameraRecoil
  - type: MindContainer
  - type: StandingState
  - type: Speech
    speechVerb: Ghost
  - type: Tag
    tags:
    - DoorBumpOpener
    - Unimplantable
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2
    useSound:
      path: /Audio/Magic/Cults/ClockCult/steam_whoosh.ogg
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Animals/space_dragon_roar.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialBones1:
            min: 6
            max: 7
          ClothingHeadHelmetBone:
            min: 1
            max: 1
          Ectoplasm:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: GhostRole
    makeSentient: true
    name: roles-antag-poltergeist-name
    description: roles-antag-poltergeist-objective
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Hands
    showInHands: false
    disableExplosionRecursion: true
    canBeStripped: false
  - type: ComplexInteraction
  - type: BorgChassis
    hasMindState: poltergeist_e
    noMindState: poltergeist_e_r
    maxModules: 4
    moduleWhitelist:
      tags:
        - SichPoltergeistAbilitiesCombat
        - SichPoltergeistAbilities
        - SichPoltergeistAbilitiesTool
        - SichPoltergeistAbilitiesSound
  - type: ContainerFill
    containers:
      borg_brain:
      - MMIFilled
      borg_module:
      - SichPoltergeistAbilitiesCombat
      - SichPoltergeistAbilities
      - SichPoltergeistAbilitiesTool
      - SichPoltergeistAbilitiesSound
