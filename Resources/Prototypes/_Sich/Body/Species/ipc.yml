- type: markingsGroup
  parent: Undergarments
  id: IPC
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: true
      default: [ IPCChassisTorso] #фактично це просто workoaround того що накладання не працюють нормально для деталей ІПШ
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: true
      default: [ IPCChassisHead ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: true
      default: [ IPCChassisLArm ]
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: true
      default: [ IPCChassisRArm ]
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: true
      default: [ IPCChassisLHand ]
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: true
      default: [ IPCChassisRHand ]
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: true
      default: [ IPCChassisLLeg ]
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: true
      default: [ IPCChassisRLeg ]
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: true
      default: [ IPCChassisLFoot ]
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: true
      default: [ IPCChassisRFoot ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceIPC
  name: IPC appearance
  components:
  - type: Inventory
    speciesId: IPC
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganIPCTorso
      Head: OrganIPCHead
      ArmLeft: OrganIPCArmLeft
      ArmRight: OrganIPCArmRight
      HandRight: OrganIPCHandRight
      HandLeft: OrganIPCHandLeft
      LegLeft: OrganIPCLegLeft
      LegRight: OrganIPCLegRight
      FootLeft: OrganIPCFootLeft
      FootRight: OrganIPCFootRight
      Brain: OrganIPCBrain
  - type: HumanoidProfile
    species: IPC

- type: entity
  parent: [ AppearanceIPC, BaseSpeciesMob, MobFlammable, MobAtmosStandard]
  id: MobIPC
  name: Urist McBot
  components:
  - type: Sprite #це усе треба бо воно перезаписує те що у парентах
    layers:
    # Torso
    - map: [ "enum.HumanoidVisualLayers.Chest" ]

    # Head
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]

    # Limbs
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]

    # Underwear & clothing
    - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
    - map: ["jumpsuit"]

    # Extremities
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    - map: ["enum.HumanoidVisualLayers.LHand"]
    - map: ["enum.HumanoidVisualLayers.RHand"]

    # Stuff that goes over the body but below equipment
    - map: ["enum.HumanoidVisualLayers.Overlay"]

    # More equipment
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "eyes" ]
    - map: [ "belt" ]
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "back" ]
    - map: [ "neck" ]

    # Stuff that goes in front of equipment
    - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]

    # Stuff that goes in front of stuff that goes in front of equipment
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]

    # Extra stuff
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false

    - map: [ "clownedon" ] # Dynamically generated
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: ipc_4_sides
      sprite: _Sich/Mobs/Species/IPC/parts.rsi
    - state: ipc_e
      sprite: _Sich/Mobs/Species/IPC/parts.rsi
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: ipc_l
      sprite: _Sich/Mobs/Species/IPC/parts.rsi
      shader: unshaded
      map: ["light"]
      visible: false
  - type: Respirator # цей компонент це один великий workaround щоб тест не сварився 
    damage:
      types:
        Asphyxiation: 0
    damageRecovery:
      types:
        Asphyxiation: 0
    minSaturation: 0         
    suffocationThreshold: -1 # "сатурація" ніколи не буде нижча за -1, тому іпш ніколи не почне "задихатись"
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
  - type: Icon
    sprite: _Sich/Mobs/Species/IPC/parts.rsi
    state: full
  - type: Butcherable
    spawned:
    - id: SheetSteel10
      amount: 3
  - type: Speech
    speechSounds: IPC
  - type: TypingIndicator
    proto: robot
  - type: Vocal
    emoteSounds: MaleIPC
    wilhelm:
      path: /Audio/_Sich/Voice/IPC/wilhelm.ogg
  - type: Damageable
    damageModifierSet: Robotic
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#171624"
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Oil
        Quantity: 600
    bloodlossDamage:
      types:
        Heat: 0.25
    bloodlossHealDamage:
      types:
        Heat: -0.5
  - type: ZombieImmune
  - type: Repairable
    damageValue: -10 # 10 seconds to repair from crit
    doAfterDelay: 1
    fuelCost: 0.5
    allowSelfRepair: true
  - type: PassiveDamage #Є щоб оновлюати дамаг в ІПШ бо схоже що гра не оновлює стан моба коли ти жахаєш дефеблрилятором, тож мінус ще бага, ще також дозваолить у теорії робити оставшого зі смерті ІПШ який перезапустився але це займе мільйон років
    allowedStates:
    - Alive
    - Critical
    damage:
      types:
        Cold: -0.01
        Heat: -0.01
        Shock: -0.01
        Blunt: -0.01
        Piercing: -0.01
        Slash: -0.01
  - type: SlowOnDamage
    speedModifierThresholds:
      70: 0.6
      90: 0.4
  - type: TemperatureDamage
    heatDamageThreshold: 452.875 # melting point of iron 1/4th, cause fuck physics you know #erm actualy there is not only iron also other things that has lower melting temperature
    coldDamageThreshold: 283.15 # 10c aka "cold" causes condensation/freezing and as such shorting
    coldDamage:
      types:
        Cold: 0.6
        Heat: -1.2
    heatDamage:
      types:
        Heat: 1.2
        Cold: -0.6
  - type: Barotrauma
    damage:
      types:
        Heat: 0.4    #типу перегрів бо у космосі вакум та неможливо охолоджуватися нормально + у ІПШ й так більший дамаг від опіків
        Blunt: 0.2    #гідравлика чи пневматика нелюбить велику різницю у тиску
  - type: Flammable
    damage:
      types:
        Heat: 1.2
  - type: FireVisuals
    alternateState: Standing
  - type: StunVisuals
  - type: TemperatureSpeed #Сповільнення від температури
    thresholds: #(типу конденсат у на схемах спиричиняє сповільнення праці)
      280: 0.95
      260: 0.8
      235: 0.6
  - type: ThermalRegulator #типу охолодження від сиситеми охолодження
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 300.15
    thermalRegulationTemperatureThreshold: 2
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: PowerCellSlot #заряд та батареки й усе що для того треба
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: PowerCellDraw
    drawRate: 0.3
  - type: Lock
    unlockTime: 30
    lockTime: 5
    locked: true
    unlockOnClick: false
  - type: WiresPanel
    openDelay: 10
  - type: LockedWiresPanel
  - type: BorgChassis
    hasMindState: ipc_4_sides
    noMindState: ipc_4_sides
    canOpenSelfUi: true
  
- type: entity
  parent: OrganBase
  id: OrganIPC
  abstract: true
  suffix: IPC

- type: entity
  id: OrganIPCMetabolizer
