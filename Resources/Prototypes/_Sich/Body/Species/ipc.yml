  components:
    - type: Sprite
      state: posibrain
      sprite: _Sich/Mobs/Species/IPC/organs.rsi
    - type: GibbableOrgan
    - type: Organ
      category: Brain
    - type: Input
      context: "ghost"
    - type: Brain
    - type: InputMover
    - type: Examiner
    - type: BlockMovement   
