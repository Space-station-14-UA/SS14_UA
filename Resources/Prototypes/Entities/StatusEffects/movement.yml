- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectSlowdown
  abstract: true
  name: уповільнення
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MovementSpeedModifier
      requireAll: true
    blacklist:
      tags:
      - SlowImmune
  - type: MovementModStatusEffect

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectSpeed
  abstract: true
  name: прискорення
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MovementSpeedModifier
      requireAll: true
  - type: MovementModStatusEffect

- type: entity
  parent: StatusEffectSpeed
  id: ReagentSpeedStatusEffect
  name: хімічне прискорення

- type: entity
  parent: StatusEffectSlowdown
  id: VomitingSlowdownStatusEffect
  name: уповільнення від блювання

- type: entity
  parent: StatusEffectSlowdown
  id: TaserSlowdownStatusEffect
  name: уповільнення від шокера

- type: entity
  parent: StatusEffectSlowdown
  id: FlashSlowdownStatusEffect
  name: уповільнення від спалаху

- type: entity
  parent: StatusEffectSlowdown
  id: StatusEffectStaminaLow
  name: низька витривалість

# Makes you more slippery, or perhaps less slippery.
- type: entity
  parent: MobStatusEffectDebuff # Debatable if this should be MobStatusEffectBase or not
  id: StatusEffectFriction
  name: тертя
  components:
  - type: FrictionStatusEffect

# Stunnable Status Effect

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectStunned
  name: оглушення
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
    blacklist:
      tags:
      - StunImmune
  - type: StatusEffectAlert
    alert: Stun
  - type: StunnedStatusEffect
