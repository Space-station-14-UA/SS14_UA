- type: entity
  name: диск ядерної автентифікації
  parent: [BaseItem, BaseGrandTheftContraband]
  id: NukeDisk
  description: Ядерний авторизаційний диск, здатний активувати ядерну бомбу, якщо його використати разом із кодом. Записка від Нанотрейзен - «ЦЕ ВАША НАЙВАЖЛИВІША ВЛАСНІСТЬ, ЗБЕРЕЖІТЬ ЦЕЙ БІСІВ ДИСК!»
  components:
  # Mriya: add interaction sounds start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Mriya/Items/handling/disk_pickup.ogg
      params:
        volume: -7
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Mriya/Items/handling/disk_drop.ogg
      params:
        volume: -7
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Mriya/Items/handling/disk_drop.ogg
      params:
        volume: -7 # Mriya: add interaction sounds end
  - type: NukeDisk
  - type: SpecialRespawn
    prototype: NukeDisk
  - type: Sprite
    sprite: Objects/Misc/nukedisk.rsi
    state: icon
  - type: StaticPrice
    price: 2000
  - type: CargoSellBlacklist
  - type: ArrivalsBlacklist
  - type: WarpPoint
    follow: true
    location: location-nuke-disk
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: NukeDisk

