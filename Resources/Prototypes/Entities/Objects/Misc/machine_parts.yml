- type: entity
  id: BaseStockPart
  name: оригінальна запчастина
  parent: BaseItem
  description: Що?
  abstract: true
  components:
    - type: Sprite
      sprite: Objects/Misc/stock_parts.rsi
    - type: Item
      size: Tiny
    - type: Stack
      count: 1
    - type: Tag
      tags:
      - ConstructionMaterial
    - type: EmitSoundOnPickup  # Mriya: add interaction sounds start
      sound:
        path: /Audio/_Mriya/Items/handling/component_pickup.ogg
    - type: EmitSoundOnDrop
      sound:
        path: /Audio/_Mriya/Items/handling/component_drop.ogg
    - type: EmitSoundOnLand
      sound:
        path: /Audio/_Mriya/Items/handling/component_drop.ogg  # Mriya: add interaction sounds end

- type: entity
  id: MicroManipulatorStockPart
  name: модульна частина машини
  parent: BaseStockPart
  description: Основна деталь машини, яка використовується для виготовлення різноманітних пристроїв.
  suffix: Rating 1
  components:
    - type: Sprite
      state: micro_mani
    - type: Stack
      stackType: Manipulator
