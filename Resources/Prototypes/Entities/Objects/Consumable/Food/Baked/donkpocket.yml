- type: entity
  name: тепла гостра-кишенька
  parent: [SolutionFoodDonkpocketWarm, FoodDonkpocketSpicy]
  id: FoodDonkpocketSpicyWarm
  description: Класична їжа для перекусу, тепер, можливо, трохи загостра.
  components:
  - type: FlavorProfile
    flavors:
      - spicy
      - meaty
      - cheap
  - type: Sprite
