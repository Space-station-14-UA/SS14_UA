  description: Небрендована ящіро-кишенька, наповнена маринованою морквою та загорнута у водорості. Найкраще їсти холодною, а ще краще - не їсти взагалі.
  components:
  - type: FlavorProfile
    flavors:
      - cold
      - cheap
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: JuiceCarrot
        Quantity: 1
      - ReagentId: Cellulose
        Quantity: 7
  - type: Sprite
    state: dink

- type: entity
  name: міль-кишенька
  parent: FoodDonkpocketBase
  id: FoodDonkpocketMoth
  description: Buzzy edition of donk-pocket that was created during mass protests ab-... Actually who cares? Just donk-pockets for moths.
  components:
  - type: FlavorProfile
    flavors:
    - cotton
    - cheap
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
  - type: Sprite
    state: moth
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - ClothMade
    - DonkPocket

- type: entity
  name: тепла міль-кишенька
