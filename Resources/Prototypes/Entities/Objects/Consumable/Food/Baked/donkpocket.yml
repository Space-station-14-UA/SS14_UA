# Base

- type: entity
  parent: [SolutionTiny, FoodInjectableBase]
  id: FoodDonkpocketBase
  abstract: true
  components:
  - type: Edible
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/donkpocket.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - DonkPocket
    - Meat

# Donkpocket

# Warm gives +5 nutriment.
# Warm ones contain a small amount of Omnizine.

- type: entity
  name: донк-кишенька
  parent: FoodDonkpocketBase
  id: FoodDonkpocket
  description: Їжа, яку обирає досвідчений зрадник.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - meaty
      - cheap
  - type: Sprite
    state: plain

- type: entity
  parent: [SolutionFood, SolutionTiny]
  id: SolutionFoodDonkpocketWarm
  categories: [ HideSpawnMenu ] # Needed for a very specific lighter so can't be abstract
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 12
      - ReagentId: Omnizine
        Quantity: 3

- type: entity
  name: тепла донк-кишенька
  parent: [SolutionFoodDonkpocketWarm, FoodDonkpocket]
  id: FoodDonkpocketWarm
  description: Тепла їжа, яку обирає досвідчений зрадник.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - meaty
      - cheap

- type: entity
  name: ароматна-кишенька
  parent: FoodDonkpocketBase
  id: FoodDonkpocketDank
  description: Їжа, яку обирає досвідчений ботанік.
  components:
  - type: FlavorProfile
    flavors:
      - leafy
      - cheap
  - type: Sprite
    state: dank

- type: entity
  name: тепла ароматна-кишенька
  parent: [SolutionFoodDonkpocketWarm, FoodDonkpocketDank]
