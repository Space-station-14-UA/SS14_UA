# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionNormal, FoodInjectableBase]
  id: FoodBreadBase
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
      - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/bread.rsi
  - type: Tag
    tags:
    - Bread
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 80

- type: entity
  parent: [SolutionVeryTiny, FoodBreadBase]
  id: FoodBreadSliceBase
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - bread
  - type: Tag
    tags:
    - Bread
    - Slice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10 # 1/8 of a loaf of bread

# Custom Bread Example

- type: entity
  name: вулканічний батон
  parent: [FoodBreadBase, BaseSlicingRefinableFood]
  id: FoodBreadVolcanic
  description: Темний батон, нагадує пемзу.
  components:
  - type: Sprite
    layers:
    - state: alpha
      color: "#281415"
    - state: alpha-filling
      color: "#FF613F"
  - type: ToolRefinable
    refineResult:
    - id: FoodBreadVolcanicSlice
      amount: 8

- type: entity
  name: вулканічна скибка
  parent: FoodBreadSliceBase
  id: FoodBreadVolcanicSlice
  description: Скибка темного батону, нагадує пемзу.
  components:
  - type: Sprite
    layers:
    - state: alpha-slice
      color: "#281415"
    - state: alpha-slice-filling
      color: "#FF613F"

