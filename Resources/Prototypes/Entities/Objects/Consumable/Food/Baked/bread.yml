- type: entity
  name: хлібний пес
  id: MobBreadDog
  parent: [SolutionLarge, FoodBase, BaseSlicingRefinableFood]
  description: Це хліб. Це собака. Це... хлібний пес?
  components:
  - type: FlavorProfile
    flavors:
    - meaty
    - bread
  - type: ToolRefinable
    refineResult:
    - id: FoodBreadSausageSlice
      amount: 5
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 105
      - ReagentId: Vitamin
        Quantity: 10
      - ReagentId: Protein
        Quantity: 10
      - ReagentId: UncookedAnimalProteins
        Quantity: 25
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: Mobs/Pets/breaddog.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: Item
    size: Ginormous
    shape:
    - 0,0,5,4
    - 0,5,0,5
    - 5,5,5,5
  - type: GhostRole
    prob: 1
    name: ghost-role-information-BreadDog-name
    allowMovement: true
