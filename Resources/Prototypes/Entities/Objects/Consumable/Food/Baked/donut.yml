# Base

- type: entity
  abstract: true
  parent: [SolutionVeryTiny, FoodInjectableBase]
  id: FoodDonutBase
  description: Goes great with robust coffee.
  components:
  - type: Tag
    tags:
    - Donut
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/donut.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 6
      - ReagentId: Sugar
        Quantity: 3
  - type: Item
    sprite: Objects/Consumable/Food/Baked/donut.rsi
    size: Tiny

- type: entity
  abstract: true
  parent: FoodDonutBase
  id: FoodDonutFruitBase
  components:
  - type: Tag
    tags:
    - Donut
    - Fruit
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 6
      - ReagentId: Sugar
        Quantity: 3
      - ReagentId: Vitamin
        Quantity: 1
# Tastes like donut.

# The sprinkles are now an overlay, so you can put them on any donut! If we really
# wanted to go for EXTREME roleplay we could apply a different color to the sprinkles
# Since it's technically an alpha layer.

# You'll be able to bake the plain donuts, then mix up different glazes for them to
# apply with a brush or something.

# Plain Donuts

- type: entity
  parent: FoodDonutBase
  id: FoodDonutPlain
  name: звичайний пончик
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    state: plain

- type: entity
  parent: FoodDonutFruitBase
  id: FoodDonutJellyPlain
  name: звичайний желейний пончик
  components:
  - type: FlavorProfile
    flavors:
      - jelly
  - type: Sprite
    state: jelly-plain

# Donuts

- type: entity
  parent: FoodDonutBase
  id: FoodDonutHomer
  name: пончик
  components:
  - type: FlavorProfile
    flavors:
      - pink
  - type: Sprite
    state: homer
  - type: Item
    heldPrefix: pink

- type: entity
  parent: FoodDonutBase
  id: FoodDonutChaos
  name: хаотичний пончик
  description: Як і життя, вона ніколи не буває однаковою на смак.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - funny
      - magical
      - tingly
  - type: Sprite
    state: chaos
# Tastes like donut, chaos.

- type: entity
  parent: FoodDonutBase
  id: FoodDonutMeat
  name: "м'ясний пончик"
  description: На смак така ж гидота, як і на вигляд.
  components:
  - type: FlavorProfile
    flavors:
      - meaty
  - type: Sprite
    state: meat
  - type: Tag
    tags:
    - Meat
    - Donut
# Tastes like meat.

- type: entity
  parent: FoodDonutBase
  id: FoodDonutPink
  name: рожевий пончик
  description: Чудово поєднується з соєвим лате.
  components:
  - type: FlavorProfile
    flavors:
      - pink
  - type: Sprite
    state: pink
  - type: Item
    heldPrefix: pink

- type: entity
  parent: FoodDonutBase
  id: FoodDonutSpaceman
  name: пончик космонавта
  description: Чудово поєднується з холодною склянкою крейди.
  components:
  - type: Sprite
    state: purple
# Tastes like donut, violets.

- type: entity
  parent: FoodDonutBase
  id: FoodDonutApple
  name: яблучний пончик
  description: Чудово смакує з порцією шнапсу з корицею.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - apple
  - type: Sprite
    state: green
# Tastes like donut, green apples.

- type: entity
  parent: FoodDonutBase
  id: FoodDonutCaramel
  name: карамельний пончик
  description: Чудово смакує з чашкою гарячого какао.
  components:
  - type: Sprite
    state: beige
# Tastes like donut, buttery sweetness.

- type: entity
  parent: FoodDonutBase
  id: FoodDonutChocolate
  name: шоколадний пончик
  description: Чудово смакує зі склянкою теплого молока.
  components:
  - type: FlavorProfile
    flavors:
      - chocolate
  - type: Sprite
    state: choc
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 6
      - ReagentId: Sugar
        Quantity: 3
      - ReagentId: Theobromine
        Quantity: 1
# Tastes like donut, bitterness.

- type: entity
  parent: FoodDonutBase
  id: FoodDonutBluePumpkin
  name: блакитногарбузовий пончик
  description: "Чудово поєднується з кухлем заспокійливого п'янкого синього гарбуза."
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - bluepumpkin
  - type: Sprite
    state: blue
# Tastes like donut, blue pumpkin.

- type: entity
  parent: FoodDonutBase
  id: FoodDonutBungo
  name: бунго пончик
  description: Чудово поєднується з баночкою з камнями для хіпі.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - bungo
  - type: Sprite
    state: yellow
# Tastes like donut, tropical sweetness.

- type: entity
  parent: FoodDonutBase
  id: FoodDonut
  name: матча пончик
  description: Л-теанін у цьому пончику розслабляє, але не викликає ейфорії. Чудово смакує з чашкою чаю.
  components:
  - type: FlavorProfile
    flavors:
      - tea
  - type: Sprite
    state: olive
# Tastes like donut, matcha.

- type: entity
  parent: FoodDonutBase
  id: FoodDonutSweetpea
  name: пончик з солодким горошком
  description: Чудово поєднується з пляшкою Bastion Burbon!
  components:
  - type: Sprite
    state: laugh
# Tastes like donut, fizzy tutti frutti.

