# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_produce.yml
# For produce that can't be immediately eaten

- type: entity
  abstract: true
  parent: [SolutionFood, SolutionTiny, BaseItem] # Produce should be less efficient volume wise
  id: ProduceBase
  components:
  - type: Sprite
    state: produce
  - type: Produce
  - type: PotencyVisuals
  - type: Appearance
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Vitamin
        Quantity: 5
  - type: Extractable
    grindableSolutionName: food

- type: entity
  abstract: true
  parent: ProduceBase
  id: ProduceBaseRuminant
  components:
  # let cows eat raw produce like wheat and oats
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - Ruminant

# For produce that can be immediately eaten

- type: entity
  parent: [SolutionTiny, FoodInjectableBase]
  id: FoodProduceBase
  abstract: true
  components:
  - type: Sprite
    state: produce
  - type: Produce
  - type: PotencyVisuals
  - type: Appearance
  - type: Extractable
    grindableSolutionName: food

