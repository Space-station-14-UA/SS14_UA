# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionSmall, FoodInjectableBase]
  id: FoodNoodlesBase
  description: Now that's a nice pasta!
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30

# Noodles

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesBoiled
  name: варені спагетті
  description: Для звичайної страви з локшини потрібно більше інгредієнтів.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
  - type: Sprite
    state: boiled
# Tastes like pasta.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodles
  name: спагетті
  description: Спагеті з помідорами. Так само, як готував твій жорстокий батько!
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - tomato
  - type: Sprite
    state: tomato
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 45
      - ReagentId: Vitamin
        Quantity: 5
  - type: Tag
    tags:
    - Fruit # ???
# Tastes like pasta, tomato.

- type: entity
  parent: [SolutionNormal, FoodNoodlesBase]
  id: FoodNoodlesCopy
  name: копіпаста
  description: Вам, мабуть, не варто пробувати, ви завжди чуєте, як люди говорять про те, як це погано...
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Edible
    trash:
    - FoodPlateSmall
    - FoodPlateSmall
  - type: FlavorProfile
    flavors:
      - copypasta
  - type: Sprite
    state: copypasta
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 90
      - ReagentId: Vitamin
        Quantity: 10
# Tastes like pasta, bad humor.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesMeatball
  name: спагетті з фрикадельками
  description: Ось це - фрикаделька!
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - meaty
  - type: Sprite
    state: meatball
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 40
      - ReagentId: Protein
        Quantity: 5
  - type: Tag
    tags:
    - Meat
# Tastes like pasta, meat.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesSpesslaw
  name: законна паста
  description: Улюблена паста адвоката.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - meaty
  - type: Sprite
    state: spesslaw
# Tastes like pasta, meat.

- type: entity
  name: чау-мейн
  parent: FoodNoodlesBase
  id: FoodNoodlesChowmein
  description: Приємне поєднання локшини та смажених овочів.
  components:
  - type: FlavorProfile
    flavors:
      - pasta
      - oily
      - eggplant
      - carrot
  - type: Sprite
    state: chowmein
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 45
      - ReagentId: Vitamin
        Quantity: 12
# Tastes like pasta, tomato.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesButter
  name: вершкова локшина
  description: Локшина, вкрита пікантним вершковим маслом. Просто і слизько, але дуже смачно.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - butter
  - type: Sprite
    state: butter
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30
      - ReagentId: Butter
        Quantity: 5
# Tastes like pasta, butter.
