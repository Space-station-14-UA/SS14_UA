- type: entity
  id: ToolboxBase
  parent: BaseStorageItem
  abstract: true
  components:
  - type: Sprite
    layers:
      - map: [ base ]
        state: icon
  # Mriya: add interaction sounds start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Mriya/Items/handling/toolbox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/toolbox_drop.ogg
  # Mriya: add interaction sounds end
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/toolbox_drop.ogg
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,6,3
    storageOpenSound: /Audio/Items/toolbox_open.ogg
    storageCloseSound: /Audio/Items/toolbox_close.ogg
    storageInsertSound: /Audio/Items/toolbox_insert.ogg
    storageRemoveSound: /Audio/Items/toolbox_remove.ogg
  - type: Item
    size: Ginormous
    shape:
    - 0,0,7,4
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
  - type: Tag
    tags:
    - Toolbox
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Appearance

- type: entity
  name: аварійний ящик для інструментів
  parent: ToolboxBase
  id: ToolboxEmergency
  description: Яскраво-червоний ящик, укомплектований приладдям для надзвичайних ситуацій.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_red.rsi

- type: entity
  name: ящик для інструментів механіка
  parent: ToolboxBase
  id: ToolboxMechanical
  description: Синій ящик, що зазвичай наповнений інструментами, які використовують механіки.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_blue.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_blue.rsi

- type: entity
  name: ящик для інструментів електрика
  parent: ToolboxBase
  id: ToolboxElectrical
  description: Жовтий ящик, що зазвичай наповнений інструментами, які використовують електрики.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi

- type: entity
  name: ящик для інструментів електрика
  suffix: Syndicate, Turret
  parent: ToolboxElectrical
  id: ToolboxElectricalTurret
  description: Жовтий ящик, що зазвичай наповнений інструментами, які використовують електрики.
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior # todo this is not a good way to be doing this. Should probably use a construction graph
        offset: 0
        spawn:
          WeaponTurretSyndicateDisposable:
            min: 1
            max: 1
  - type: StaticPrice
    price: 1350

- type: entity
  name: ящик для інструментів митця
  parent: ToolboxBase
  id: ToolboxArtistic
  description: Зелений ящик, що зазвичай наповнений митецьким приладдям.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_green.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_green.rsi

- type: entity
  name: підозрілий ящик для інструментів
  parent: [ToolboxBase, BaseSyndicateContraband]
  id: ToolboxSyndicate
  description: Зловісного вигляду червоно-сірий ящик, наповнений елітними інструментами синдикату (можливо).
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_syn.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_syn.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,3
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 20

- type: entity
  name: золотий ящик для інструментів
  parent: ToolboxBase
  id: ToolboxGolden
  description: Ящик з чистого твердого золота 999 проби. Янукович вбив би за таке...
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_gold.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/toolbox_gold.rsi

- type: entity
  name: foolbox
  parent: ToolboxBase
  id: Foolbox
  description: A toolbox for fools, stocked with clowning equipment.
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/foolbox.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/Toolboxes/foolbox.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 2
    soundHit: &SoundRubberHammer
      collection: RubberHammer
      params:
        variation: 0.03
        volume: 3
  - type: EmitSoundOnLand
    sound: *SoundRubberHammer
  - type: Storage
    storageOpenSound: &SoundHorn
      collection: BikeHorn
      params:
        variation: 0.125
    storageCloseSound: *SoundHorn
    storageInsertSound: &SoundSqueak
      collection: FootstepClown
      params:
        variation: 0.125
    storageRemoveSound: *SoundSqueak
