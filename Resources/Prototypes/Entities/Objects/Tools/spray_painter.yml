- type: entity
  parent: BaseItem
  id: SprayPainterRecharging
  name: фарбувальник
  suffix: Admeme
  description: Розпилювач фарби для фарбування шлюзів, труб та інших предметів.
  components:
  - type: Sprite
    sprite: Objects/Tools/spray_painter.rsi
    state: spray_painter
  - type: Item
    sprite: Objects/Tools/spray_painter.rsi
  - type: ActivatableUI
    key: enum.SprayPainterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SprayPainterUiKey.Key:
        type: SprayPainterBoundUserInterface
  - type: SprayPainter
    colorPalette: # Atmos pipes preset colors
      red: '#FF1212FF'
      yellow: '#B3A234FF'
      brown: '#947507FF'
      green: '#3AB334FF'
      cyan: '#03FCD3FF'
      blue: '#0335FCFF'
      white: '#FFFFFFFF'
      black: '#333333FF'
      # standard atmos pipes
      waste: '#990000'
      distro: '#0055cc'
      air: '#03fcd3'
      mix: '#947507'
  - type: StaticPrice
    price: 40
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  parent: SprayPainterRecharging
  id: SprayPainter
  suffix: ""
  components:
  - type: LimitedCharges
    maxCharges: 15
    lastCharges: 15

- type: entity
  parent: SprayPainter
  name: експерементальний фарбувальник
  description: Експериментальний розпилювач фарби із функцією самопоповнення, здатний безперервно подавати стиснуту фарбу.
  id: SprayPainterBorg
  suffix: Borg
  components:
  - type: AutoRecharge
    rechargeDuration: 5

- type: entity
  parent: SprayPainter
  id: SprayPainterEmpty
  suffix: Empty
  components:
  - type: LimitedCharges
    lastCharges: -1

# Ammo

- type: entity
  parent: BaseItem
  id: SprayPainterAmmo
  name: стиснена фарба
  description: Картридж із стисненою фарбою, що зазвичай використовується у фарбувальниках.
  components:
  - type: SprayPainterAmmo
  - type: Sprite
    sprite: Objects/Tools/spray_painter.rsi
    state: ammo
  - type: Item
    sprite: Objects/Tools/spray_painter.rsi
    heldPrefix: ammo
  - type: PhysicalComposition
    materialComposition:
      Steel: 10
      Plastic: 10
  - type: StaticPrice
    price: 30
