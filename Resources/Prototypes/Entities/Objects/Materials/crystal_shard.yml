- type: entity
  abstract: true
  parent: MaterialBase
  id: ShardCrystalBase
  name: кристалевий уламок
  description: Маленький шматок кристалу.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    layers:
      - sprite: Objects/Materials/Shards/crystal-shard.rsi
        state: shard1
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          shard1: ""
          shard2: ""
          shard3: ""
  - type: SpaceGarbage
  - type: MeleeWeapon
    wideAnimationRotation: -22.5
    attackRate: 1.5
    damage:
      types:
        Slash: 3.5
  - type: Damageable
    damageModifierSet: Glass
  - type: StaticPrice
    price: 50

- type: entity
  parent: ShardCrystalBase
  id: ShardCrystalCyan
  name: уламок блакитного кристалу
  description: Маленький шматок кристалу.
  components:
  - type: Sprite
    color: "#47f8ff"
  - type: PointLight
    radius: 2
    energy: 2.5
    color: "#47f8ff"
  - type: Tag
    tags:
      - Trash
      - CrystalCyan

