- type: entity
  abstract: true
  parent: BaseSheet
  id: SheetGlassBase
  name: скло
  description: Прозорий лист скла, його часто використовується на станції та у багатьох інших місцях та сферах.
  components:
  - type: Sprite
    sprite: Objects/Materials/Sheets/glass.rsi
  - type: Item
    sprite: Objects/Materials/Sheets/glass.rsi
  - type: Damageable
    damageModifierSet: Glass

- type: entity
  parent: SheetGlassBase
  id: SheetGlass
  suffix: Повний
  components:
  - type: PhysicalComposition
    materialComposition:
      Glass: 100
  - type: Stack
    stackType: Glass
    baseLayer: base
    layerStates:
    - glass
    - glass_2
    - glass_3
  - type: Sprite
    state: glass_3
    layers:
    - state: glass_3
      map: ["base"]
  - type: Item
    heldPrefix: glass
  - type: FloorTile
    outputs:
    - FloorGlass
  - type: Construction
    graph: Glass
    node: SheetGlass
  - type: Solution
    solution:
      reagents:
      - ReagentId: Silicon
        Quantity: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1

- type: entity
  parent: SheetGlass
  id: SheetGlass10
  suffix: 10
  components:
  - type: Sprite
    state: glass
  - type: Stack
    stackType: Glass
    count: 10

- type: entity
  parent: SheetGlass
  id: SheetGlass1
  suffix: Одне
  components:
  - type: Sprite
    state: glass
  - type: Stack
    stackType: Glass
    count: 1

- type: entity
  parent: SheetGlassBase
  id: SheetRGlass
  name: армоване скло
  description: Все ще прозорий лист армованого скла.
  suffix: Повний
  components:
  - type: PhysicalComposition
    materialComposition:
      ReinforcedGlass: 100
  - type: Stack
    stackType: ReinforcedGlass
    baseLayer: base
    layerStates:
    - rglass
    - rglass_2
    - rglass_3
  - type: Sprite
    state: rglass_3
    layers:
    - state: rglass_3
      map: ["base"]
  - type: Item
    heldPrefix: rglass
  - type: FloorTile
    outputs:
    - FloorRGlass
  - type: Construction
    graph: Glass
    node: SheetRGlass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 1
  - type: Solution
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Silicon
        Quantity: 10
      - ReagentId: Iron
        Quantity: 4.5
      - ReagentId: Carbon
        Quantity: 0.5

