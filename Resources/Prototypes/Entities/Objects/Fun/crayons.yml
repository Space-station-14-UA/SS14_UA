# When adding new crayons, also add it to id: AllCrayonsTable

- type: entity
  abstract: true
  parent: [SolutionFood, SolutionVeryTiny, BaseItem] # Crayons are less pourous than most foods, so we just assume they have less capacity.
  id: CrayonInedible
  name: крейда
  description: Кольорова крейда. Заборонений смак.
  components:
  - type: Sprite
    sprite: Objects/Fun/crayons.rsi
  - type: Item
    sprite: Objects/Fun/crayons.rsi
    size: Tiny
  - type: Tag
    tags:
    - Write
    - Crayon
    - Trash
    - Recyclable
  - type: SpaceGarbage
  - type: UserInterface
    interfaces:
      enum.CrayonUiKey.Key:
        type: CrayonBoundUserInterface
  - type: Crayon
    selectedState: like
  - type: LimitedCharges
    maxCharges: 25
  - type: StaticPrice
    price: 5

- type: entity
  abstract: true
  parent: CrayonInedible
  id: Crayon
  description: Кольорова крейда. Виглядає смачно. Мммммм...
  components:
  - type: Edible
  - type: FlavorProfile
    flavors:
    - chewy
    - bitter
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: MindbreakerToxin
        Quantity: 10

# special crayons

- type: entity
  parent: Crayon
  id: CrayonMime
  name: крейда міма
  components:
  - type: Sprite
    state: mime
  - type: Item
    heldPrefix: mime
  - type: Crayon
    color: white
  - type: Tag
    tags:
    - Write
    - Crayon
    - CrayonWhite
    - Recyclable
    - Trash

- type: entity
  parent: Crayon
  id: CrayonRainbow
  name: веселкова крейда
  components:
  - type: Sprite
    state: rainbow
  - type: Item
    heldPrefix: rainbow
  - type: Crayon
    color: Red
    selectableColor: true
  - type: LimitedCharges
    maxCharges: 30
  - type: Tag
    tags:
    - CrayonRainbow #Sich

- type: entity
  parent: CrayonRainbow
  id: CrayonInfinite # should not be player available to prevent decal spam
  categories: [ DoNotMap ]
  name: нескінченна крейда
  components:
  - type: Crayon
    deleteEmpty: false
  - type: AutoRecharge
    rechargeDuration: 5

- type: entity
  parent: CrayonInedible
  id: CrayonBorg
  name: електрична крейда
  description: Напевно найсмачніша крейда в усьому світі!; Нажаль, ти не зможеш її з'їсти.
  components:
  - type: Sprite
    state: electric
  - type: Item
    heldPrefix: electric
  - type: Crayon
    deleteEmpty: false
    color: Red
    selectableColor: true
  - type: AutoRecharge
    rechargeDuration: 5

