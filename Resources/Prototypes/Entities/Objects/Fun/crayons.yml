- type: entity
  parent: BoxCardboard
  id: CrayonBoxEmpty
  name: коробка крейди
  description: це коробка крейди.
  components:
  - type: Sprite
    sprite: _Sich/Objects/Fun/crayons.rsi #Sich
    state: box
  - type: Storage
    grid:
    - 0,0,8,0 #Sich
    maxItemSize: Tiny
  - type: Item
    sprite: _Sich/Objects/Fun/crayons.rsi #Sich
    size: Small
    shape:
    - 0,0,1,1
    heldPrefix: box
  - type: ItemMapper
    mapLayers:
      black_box:
        whitelist:
          tags:
          - CrayonBlack
      blue_box:
        whitelist:
          tags:
          - CrayonBlue
      green_box:
        whitelist:
          tags:
          - CrayonGreen
      orange_box:
        whitelist:
          tags:
          - CrayonOrange
      purple_box:
        whitelist:
          tags:
          - CrayonPurple
      red_box:
        whitelist:
          tags:
          - CrayonRed
      yellow_box:
        whitelist:
          tags:
          - CrayonYellow
      white_box:
        whitelist:
          tags:
          - CrayonWhite
      rainbow_box: #Sich
        whitelist:
          tags:
          - CrayonRainbow
  - type: Appearance

- type: entity
  parent: CrayonBoxEmpty
  id: CrayonBox
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: CrayonRed
        - id: CrayonOrange
        - id: CrayonYellow
        - id: CrayonGreen
        - id: CrayonBlue
        - id: CrayonPurple
        - id: CrayonBlack
        - id: CrayonWhite
        - id: CrayonRainbow #Sich
