- type: entity
  id: TableBilliard
  parent: BaseStructure
  name: більярдний стіл
  description: Стандартний більярдний стіл із зеленим сукном. Ідеальне місце для відпочинку після зміни.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Objects/Fun/Billiards/billiard_table.rsi
    state: table
    scale: 1.2, 1.2
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: TableBilliard
    node: tableBilliard
  - type: Fixtures
    fixtures:
      border_north:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.408, 0.744, 0.408, 0.864"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001

      border_south:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.408, -0.9, 0.408, -0.792"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001

      border_west_top:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6, 0.072, -0.48, 0.672"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001

      border_west_bottom:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6, -0.708, -0.48, -0.108"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001

      border_east_top:
        shape:
          !type:PhysShapeAabb
          bounds: "0.48, 0.072, 0.6, 0.672"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001

      border_east_bottom:
        shape:
          !type:PhysShapeAabb
          bounds: "0.48, -0.708, 0.6, -0.108"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001

      pocket_nw:
        shape:
          !type:PhysShapeCircle
          radius: 0.072
          position: -0.528, 0.792
        hard: false
        mask: [ DoorPassable ]

      pocket_ne:
        shape:
          !type:PhysShapeCircle
          radius: 0.072
          position: 0.528, 0.792
        hard: false
        mask: [ DoorPassable ]

      pocket_sw:
        shape:
          !type:PhysShapeCircle
          radius: 0.072
          position: -0.528, -0.828
        hard: false
        mask: [ DoorPassable ]

      pocket_se:
        shape:
          !type:PhysShapeCircle
          radius: 0.072
          position: 0.528, -0.828
        hard: false
        mask: [ DoorPassable ]

      pocket_w:
        shape:
          !type:PhysShapeCircle
          radius: 0.072
          position: -0.5592, -0.012
        hard: false
        mask: [ DoorPassable ]

      pocket_e:
        shape:
          !type:PhysShapeCircle
          radius: 0.072
          position: 0.552, -0.012
        hard: false
        mask: [ DoorPassable ]
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Storage
    grid:
    - 0,0,4,3
    maxItemSize: Small
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: BilliardTable
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Anchorable
  - type: Rotatable

- type: entity
  id: BilliardBall
  parent: BaseItem
  name: більярдна куля
  description: Важка і гладка куля для гри в більярд.
  components:
  - type: Sprite
    sprite: Objects/Fun/Billiards/billiard_ball.rsi
    layers:
    - state: ball
      map: [ "enum.BilliardVisualLayers.Base" ]
    - state: ball_second
      map: [ "enum.BilliardVisualLayers.Stripe" ]
      visible: false
    scale: 0.096, 0.096
  - type: Appearance
  - type: Item
    size: Tiny
  - type: TileFrictionModifier
    modifier: 0.2
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0.4      # Зменшено (було 1.0), щоб куля котилася довше і реалістичніше
    angularDamping: 0.2     # Зменшено (було 1.5), щоб вільніше оберталася
    sleepingAllowed: false
  - type: Damageable
  - type: BilliardBall
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.042
        density: 10
        restitution: 0.85   # Збільшено (було 0.45). Чим ближче до 1.0, тим сильніший відскік
        friction: 0.01      # Залишено як є, тертя ідеальне для гладкої кулі
        mask:
        - DoorPassable
        - Impassable
        layer:
        - DoorPassable

- type: entity
  parent: BaseItem
  id: BilliardCue
  name: більярдний кий
  description: Більярдний кий, щоб грати в більярд
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Fun/Billiards/billiard_cue.rsi
    state: icon
  - type: MeleeWeapon
    range: 3
    wideAnimationRotation: -180
    damage:
        types:
          Blunt: 5
          Structural: 1
  - type: BilliardCue
  - type: MeleeThrowOnHit
    speed: 5
    distance: 0.000000001
    cameraRecoilOnThrown: false

