        doAfter: 0.1
      - component: BilliardsBall
        doAfter: 0.1
      - component: BilliardsBall
        doAfter: 0.1
      - component: BilliardsBall
        doAfter: 0.1
      - component: BilliardsBall
        doAfter: 0.1
      - component: BilliardsBall
        doAfter: 0.1
      - component: BilliardsBall
        doAfter: 0.1
      - component: BilliardsBall
        doAfter: 0.1
      - component: BilliardsBall
        doAfter: 0.1
  - node: triangle
    entity: SpawnBilliardsTriangle

- type: constructionGraph
  id: BilliardsAmericanPoolGraph
  start: start
  graph:
