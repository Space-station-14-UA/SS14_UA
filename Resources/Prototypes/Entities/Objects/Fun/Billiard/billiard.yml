- type: entity
  id: TableBilliards
  parent: BaseStructure
  name: більярдний стіл
  description: Стандартний більярдний стіл із зеленим сукном. Ідеальне місце для відпочинку після зміни.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Objects/Fun/Billiards/billiards_table.rsi
    state: table
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: TableBilliards
    node: tableBilliards
  - type: Fixtures
    fixtures:      
      # Верхній борт (вкорочений по краях)
      border_north:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.34, 0.62, 0.34, 0.72  " # Не доходить до країв на 0.1
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
        
      # Нижній борт (вкорочений по краях)
      border_south:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.34, -0.66, 0.34, -0.75"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
        
      # Лівий борт (Верхня половина)
      border_west_top:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.50, 0.06, -0.4, 0.56" # Від центру до кута
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
        
      # Лівий борт (Нижня половина)
      border_west_bottom:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.50, -0.09, -0.4, -0.59"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
        
      # Правий борт (Верхня половина)
      border_east_top:
        shape:
          !type:PhysShapeAabb
          bounds: "0.40, 0.06, 0.50, 0.56"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
        
      # Правий борт (Нижня половина)
      border_east_bottom:
        shape:
          !type:PhysShapeAabb
          bounds: "0.4, -0.09, 0.50, -0.59"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
      
      pocket_nw:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: -0.44,0.66
        hard: false
        mask: [ DoorPassable ]
        
      pocket_ne:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: 0.44,0.66
        hard: false
        mask: [ DoorPassable ]
        
      pocket_sw:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: -0.44,-0.69
        hard: false
        mask: [ DoorPassable ]
        
      pocket_se:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: 0.44,-0.69
        hard: false
        mask: [ DoorPassable ]
        
      pocket_w:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: -0.466,-0.01
        hard: false
        mask: [ DoorPassable ]
        
      pocket_e:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: 0.46,-0.01
        hard: false
        mask: [ DoorPassable ]
  - type: Damageable
    damageContainer: Structure
  - type: Storage
    grid:
    - 0,0,4,3
    maxItemSize: Small
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: BilliardsTable
  - type: Anchorable
  - type: Rotatable

- type: entity
  id: BilliardsBall
  parent: BaseItem
  name: більярдна куля
  description: Важка і гладка куля для гри в більярд.
  components:
  - type: Sprite
    sprite: Objects/Fun/Billiards/billiards_ball.rsi
    layers:
    - state: ball
      map: [ "enum.BilliardsVisualLayers.Base" ]
    - state: ball_second
      map: [ "enum.BilliardsVisualLayers.Stripe" ]
      visible: false
    scale: 0.08,0.08
  - type: Appearance
  - type: Item
    size: Tiny
  - type: TileFrictionModifier
    modifier: 0.2
  - type: Physics
    bodyType: Dynamic
    linearDamping: 1.0
    angularDamping: 1.5
    sleepingAllowed: false
  - type: Damageable
  - type: BilliardsBall
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.035
        density: 5
        restitution: 0.45
        friction: 0.01
        mask:
        - DoorPassable
        - Impassable
        layer:
        - DoorPassable

- type: entity
  parent: BaseItem
  id: BilliardCue
  name: більярдний кий
  description: Більярдний кий, щоб грати в більярд
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Fun/Billiards/billiards_cue.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -180
    damage:
        types:
          Blunt: 5
          Structural: 1
  - type: BilliardsCue
  - type: MeleeThrowOnHit
    speed: 5
    distance: 0.000000001
    cameraRecoilOnThrown: false

- type: entity
  id: SpawnBilliardsTriangle
  parent: BaseItem
  name: спавнер піраміди більярдних куль
  components:
  - type: Sprite
    sprite: Objects/Fun/Billiards/billiards_ball.rsi
    state: ball_triangle
    scale: 1,1
    drawdepth: Effects
  - type: Construction
    graph: BilliardsTriangleGraph
    node: triangle
  - type: BilliardsSpawner
    ballPrototype: BilliardsBall
    ballSpacing: 0.082
    rows: 5
    gameType: Pyramid

- type: entity
  id: SpawnBilliardsAmericanPool
  parent: SpawnBilliardsTriangle
  name: спавнер піраміди американського більярду
  components:
  - type: Construction
    graph: BilliardsTriangleGraph
    node: triangle
  - type: BilliardsSpawner
    gameType: AmericanPool

