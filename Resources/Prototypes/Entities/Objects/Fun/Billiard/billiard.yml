- type: construction
  id: SpawnBilliardsTriangle
  name: більярд піраміда
  description: Зберіть 16 більярдних куль у трикутник для початку гри.
  graph: BilliardsTriangleGraph
  startNode: start
  targetNode: triangle
  category: Fun # Категорія в меню "G"
  placementMode: PlaceFree # Дозволяє вільно розмістити привид будь-де на столі без жорсткої прив'язки до сітки станції
  icon:
    sprite: Objects/Fun/Billiards/biliards_ball.rsi
    state: ball_triangle

- type: construction
  id: SpawnBilliardsAmericanPool
  name: більярд американка
  description: Зберіть 16 більярдних куль у трикутник для початку гри.
  graph: BilliardsAmericanPoolGraph
  startNode: start
  targetNode: AmericanPool
  category: Fun # Категорія в меню "G"
  placementMode: PlaceFree # Дозволяє вільно розмістити привид будь-де на столі без жорсткої прив'язки до сітки станції
  icon:
    sprite: Objects/Fun/Billiards/biliards_ball.rsi
    state: ball_triangle

- type: entity
  parent: BaseFlatpack
  id: BilliardsTableFlatpack
  name: Більярд флетпак
  description: Флетпак для конструювання столу для більярду. Використайте мультитул.
  components:
  - type: Sprite
    layers:
    - state: billiard-table
  - type: Flatpack
    entity: TableBilliards
  - type: StaticPrice
    price: 600

- type: constructionGraph
  id: TableBilliards
  start: start
  graph:
    - node: start
    - node: tableBilliards
      entity: TableBilliards
      edges:
        - to: start
          conditions:
            - !type:ContainerEmpty
             container: "storagebase"
             examineText: "Сховище не порожнє!"
             guideStep: "Спорожніть схвоище столу!"
          completed:
            - !type:SpawnPrototype
              prototype: BilliardsTableFlatpack
              amount: 1
            - !type:DeleteEntity
          steps:
            - tool: Screwing
              doAfter: 3

- type: entity
  name: коробка для більярду
  parent: BoxCardboard
  id: BoxBilliardBalls
  description: Коробка для більярдних куль
  components:
  - type: Sprite
    layers:
      - state: box
      - state: balls
  - type: Storage
    grid:
    - 0,0,3,3
    whitelist: # TODO cardboard boxes shouldn't have whitelisting
      components:
      - BilliardsBall
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: BilliardsBall
          amount: 16

- type: entity
  parent: CrateGenericSteel
  id: CrateBilliardComplect
  name: ящик з комплектом для більярду
  description: Флетпак більярдного столу, коробка метаморфозних куль та два кия - все що треба для гарного вечора!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BoxBilliardBalls
        - id: BilliardsTableFlatpack
        - id: BilliardCue
          amount: 2