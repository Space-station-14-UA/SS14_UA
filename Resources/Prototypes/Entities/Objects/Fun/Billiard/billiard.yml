- type: entity
  parent: BaseFlatpack
  id: BilliardTableFlatpack
  name: Більярд флетпак
  description: Флетпак для конструювання столу для більярду. Використайте мультитул.
  components:
  - type: Sprite
    layers:
    - state: billiard-table
  - type: Flatpack
    entity: TableBilliard
  - type: StaticPrice
    price: 600

- type: constructionGraph
  id: TableBilliard
  start: start
  graph:
    - node: start
    - node: tableBilliard
      entity: TableBilliard
      edges:
        - to: start
          conditions:
            - !type:ContainerEmpty
             container: "storagebase"
             examineText: "Сховище не порожнє!"
             guideStep: "Спорожніть схвоище столу!"
          completed:
            - !type:SpawnPrototype
              prototype: BilliardTableFlatpack
              amount: 1
            - !type:DeleteEntity
          steps:
            - tool: Screwing
              doAfter: 3

- type: entity
  name: коробка для більярду
  parent: BoxCardboard
  id: BoxBilliardBalls
  description: Коробка для більярдних куль
  components:
  - type: Sprite
    layers:
      - state: box
      - state: balls
  - type: Storage
    grid:
    - 0,0,3,3
    whitelist: # TODO cardboard boxes shouldn't have whitelisting
      components:
      - BilliardBall
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: BilliardBall
          amount: 16

- type: entity
  parent: CrateGenericSteel
  id: CrateBilliardComplect
  name: ящик з комплектом для більярду
  description: Флетпак більярдного столу, коробка метаморфозних куль та два кия - все що треба для гарного вечора!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BoxBilliardBalls
        - id: BilliardTableFlatpack
        - id: BilliardCue
          amount: 2

- type: cargoProduct
  id: CrateBilliardComplect
  icon:
    sprite: Objects/Fun/Billiards/billiard_table.rsi
    state: table
  product: CrateBilliardComplect
  cost: 5000
  category: cargoproduct-category-name-fun
  group: market
