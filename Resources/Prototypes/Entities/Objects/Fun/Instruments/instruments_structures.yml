- type: entity
  name: піаніно
  parent: BasePlaceableInstrumentRotatable
  id: PianoInstrument
  description: Грайте на піаніно, ВЖЕ!
  components:
  - type: Instrument
    program: 1
  - type: Sprite
    state: piano
  - type: Climbable
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds: &ThresholdsFurnitureStrongWood
    - trigger: &DamageFurnitureStrong
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -3
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 2
            max: 4

- type: entity
  name: фортепіано
  parent: BasePlaceableInstrumentRotatable
  id: UprightPianoInstrument
  description: Я сказав Піяно!
  components:
  - type: Instrument
    program: 3
  - type: Sprite
    state: piano-upright
  - type: Climbable
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds: *ThresholdsFurnitureStrongWood

- type: entity
  name: вібрафон
  id: VibraphoneInstrument
  parent: BasePlaceableInstrumentRotatable
  description: Гарні вібрації навколо.
  components:
  - type: Instrument
    program: 11
  - type: Sprite
    state: vibraphone
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds: &ThresholdsFurnitureStrongRods
    - trigger: *DamageFurnitureStrong
      behaviors:
      - &SoundMetalBreak !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 2
            max: 4

