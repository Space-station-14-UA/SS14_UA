- type: entity
  parent: [ BasePlaceableInstrumentRotatable, ConstructibleMachine]
  id: DawInstrument
  name: цифрова аудіостанція
  description: Найсучасніші музичні технології, прямо з 90-х років.
  components:
  - type: Sprite
    layers:
    - state: daw-base
    - state: daw-display
      shader: unshaded
    - state: daw-panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: WiresVisuals
  - type: WiresPanel
  - type: Machine
    board: DawInstrumentMachineCircuitboard
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
  - type: Destructible
    thresholds:
    - trigger: *DamageFurnitureStrong
      behaviors:
      - *SoundMetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame

