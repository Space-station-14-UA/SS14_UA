- type: entity
  id: ContrabassInstrument
  parent: BasePlaceableInstrument
  name: контрабас
  description: Ідеально підходить для створення приємного джазового ритму.
  components:
  - type: Instrument
    program: 43
  - type: Sprite
    state: contrabass
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds: *ThresholdsFurnitureStrongWood
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 180
        mask:
        - Impassable
        - HighImpassable
        - MidImpassable
        layer:
        - Opaque
        - HighImpassable
        - MidImpassable
        - BulletImpassable

