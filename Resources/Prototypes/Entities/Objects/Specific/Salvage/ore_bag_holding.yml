- type: entity
  name: блюспейс сумка для руди
  id: OreBagOfHolding
  parent: OreBag
  description: Міцна сумка для шахтарів-мільярдерів. Використовується для перевезення ВЕЛИЧЕЗНОЇ кількості руди. Примагнічує будь-яку руду, яка знаходиться поряд з користувачем, коли одягнена на пояс.
  components:
  - type: MagnetPickup
    range: 2
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag_holding.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag_holding.rsi
  - type: Storage
    grid:
    - 0,0,19,9

- type: entity
  parent: OreBagOfHolding
  id: BorgOreBagOfHolding
  name: integrated ore bag of holding
  description: A very large ore bag built into the frame of a rich mining cyborg. Magnetises any nearby ores when held.
  components:
    - type: MagnetPickup
      slotFlags: null
      range: 2
      requireActiveHand: true
