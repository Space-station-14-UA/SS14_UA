  name: екстрений медіпен
  description: Швидкий і безпечний спосіб стабілізації пацієнтів у критичному стані для персоналу без передових медичних знань. Будьте обережні, оскільки передозування адреналіну та транексамової кислоти дуже просто отримати.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: medipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: medipen_empty
  - type: Solution
    solution:
      reagents:
      - ReagentId: Epinephrine
        Quantity: 15
      - ReagentId: TranexamicAcid
        Quantity: 5

