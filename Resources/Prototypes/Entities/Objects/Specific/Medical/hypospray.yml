- type: entity
  abstract: true
  parent: [SolutionHypospraySmall, BaseItem]
  id: BaseHypoInjector
  components:
  - type: Injector
    solutionName: hypospray
    ignoreClosed: false
    activeModeProtoId: HyposprayDynamicMode
    allowedModes:
    - HyposprayDynamicMode
    - HyposprayInjectMode
  - type: ExaminableSolution
    solution: hypospray
    exactVolume: true
  - type: UseDelay
    delay: 0.5
  - type: Appearance

- type: entity
  abstract: true
  parent: BaseHypoInjector
  id: BaseHypospray
  components:
  - type: Spillable
    solution: hypospray
    spillWhenThrown: false

- type: entity
  abstract: true
  parent: [SolutionHypospray, SolutionToolSmall]
  id: SolutionHypospraySmall
  components:
  - type: Solution
    solution:
      maxVol: 20

- type: entity
  abstract: true
  parent: [SolutionHypospray, SolutionToolTiny]
  id: SolutionHyposprayTiny
  components:
  - type: Solution
    solution:
      maxVol: 10

- type: entity
  parent: [SolutionToolSmall, BaseHypospray, BaseGrandTheftContraband]
  id: Hypospray
  name: гіпоспрей
  description: Стерильний інжектор для швидкого введення ліків пацієнтам.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: RefillableSolution
    solution: hypospray
  - type: StaticPrice
    price: 750
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: Hypospray
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: hypo_fill
    solutionName: hypospray

- type: entity
  parent: [BaseHypospray, BaseSyndicateContraband]
  id: SyndiHypo
  name: гіпоспрей горлакса
  description: Використовуючи зворотню інженерну конструкцію з Нанотрейзен, Кіберсан виготовив їх в обмежених кількостях для оперативників-мародерів горлакса.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/syndihypo.rsi
    layers:
      - state: hypo
        map: ["enum.SolutionContainerLayers.Base"]
      - state: hypo_fill1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Item
    sprite: Objects/Specific/Medical/syndihypo.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: hypo_fill
    solutionName: hypospray

- type: entity
  parent: [SolutionHyposprayTiny, BaseHypospray]
  id: BorgHypo
  name: борг-гіпо
  description: Стерильний інжектор для швидкого введення ліків пацієнтам. Дешевша і більш спеціалізована версія для медичних боргів.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: borghypo
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: borghypo_fill1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: RefillableSolution
    solution: hypospray
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: borghypo_fill
    solutionName: hypospray

- type: entity
  parent: BaseHypospray
  id: JetInjector
  name: jet injector
  description: A sterile injector for convenient administration of drugs to patients.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/jetinjector.rsi
    layers:
    - state: jetinjector_base
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: jetinjector_filled1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/jetinjector.rsi
  - type: UseDelay
    delay: 1.5
  - type: Solution
    solution:
      maxVol: 15 # Same as a syringe
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: jetinjector_filled
    solutionName: hypospray
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: null # Inject everything on injection.
    activeModeProtoId: JetInjectorDynamicMode
    allowedModes:
    - JetInjectorDynamicMode
    - JetInjectorInjectMode

- type: entity
  parent: [SolutionHypospraySmall, JetInjector]
  id: AdvancedJetInjector
  name: advanced jet injector
  description: A pristine, fashionable, high quality injector. Allows for a faster injection, with a slightly larger capacity.
