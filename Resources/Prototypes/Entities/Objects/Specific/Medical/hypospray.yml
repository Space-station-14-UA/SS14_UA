  name: експериментальний гіпоспрей
  suffix: Admeme
  description: Максимальне застосування технології блюспейс і швидкого введення хімікатів.
  components:
  - type: Solution
    solution:
      maxVol: 3000 # Badmin abuse
  - type: UseDelay
    delay: 0.0

- type: entity
  parent: BaseHypoInjector # I plan to resize medipens to 1x2 eventually:tm:
  id: ChemicalMedipen
  name: хімічний медіпен
  description: Стерильний інжектор для швидкого введення ліків пацієнтам. Не перезаправляється.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: firstaid
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Item
    sprite: Objects/Specific/Medical/medipen.rsi
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#439822"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#439822"
      - state: base-colorB-inhand-right
    size: Tiny
  - type: Injector
    currentTransferAmount: null
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: firstaid_empty
    solutionName: hypospray
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  - type: SpaceGarbage
  - type: StaticPrice
    price: 75 # These are limited supply items.
  - type: TrashOnSolutionEmpty
    solution: hypospray

- type: entity
