- type: entity
  parent: BaseHealingItem
  id: HealingToolbox
  name: лікуючий ящик інструментів
  description: Потужнійший ящик інструментів наповнений робасною енергією. Він може зцілити ваші рани і сповнити вас вбивчим наміром.
  categories: [ DoNotMap ]
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/healing_toolbox.rsi
    state: icon
  - type: Healing
    damageContainers:
    - Biological
    damage:
      types: # these are all split across multiple types
        Blunt: -50
        Piercing: -50
        Slash: -50
        Heat: -50
        Cold: -50
        Shock: -50
        Poison: -150
    bloodlossModifier: -20
    delay: 1
    selfHealPenaltyMultiplier: 0
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
      params:
        volume: 1.0
        variation: 0.125

