- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: BaseTargetIndestructible
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_stake
    noRot: true
  - type: Repairable
  - type: DamagePopup
    allowTypeChange: true
    damagePopupType: Combined
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 200
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: InteractionOutline
  - type: Physics
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic

- type: entity
  abstract: true
  parent: BaseTargetIndestructible
  id: BaseTarget
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 5
            max: 5
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


- type: entity
  parent: BaseTarget
  id: TargetHuman
  name: мішень-людина
  description: Мішень для стрільб. Це людина.
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_h

- type: entity
  parent: BaseTarget
  id: TargetSyndicate
  name: мішень-синдикатівець
  description: Мішень для стрільб. Це агент синдикату!
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_s

- type: entity
  parent: BaseTarget
  id: TargetClown
  name: мішень-клоун
  description: Мішень для стрільб. Це клоун, стережися! Фух.. Всього лише мішень, але будь пильним!
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_c

# put it on a salvage or something
- type: entity
  parent: BaseTargetIndestructible
  id: TargetStrange
  name: дивна мішень
  description: Мішень для стрільб. Ви не зовсім впевнені, що це таке, але здається, що мішень дуже робастна!
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_f
