- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: HoloparasiteInjector
  name: інжектор голопаразиту
  description: Складний витвір ручної техніки, що дозволяє користувачеві приймати у себе охоронця-голопаразита.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    state: combat_hypo
  - type: GuardianCreator
    guardianProto: MobHoloparasiteGuardian

- type: entity
  parent: HoloparasiteInjector
  id: HoloClownInjector
  name: інжектор голоклоуна
  description: Складний витвір мистецтва з ручної техніки, що дозволяє користувачеві приймати охоронця-голоклоуна.
  components:
  - type: GuardianCreator
    guardianProto: MobHoloClownGuardian

- type: entity
  parent: [BaseItem, BaseMagicalContraband]
  id: GuardianDeck
  name: колода Охоронця
  description: Колода карт таро Охоронця, здатна прив'язати особистого охоронця до вашого тіла.
  components:
  - type: Sprite
    sprite: Objects/Misc/Lights/lamp.rsi
    layers:
      - state: lamp
  - type: GuardianCreator
    guardianProto: MobIfritGuardian
    emptyPopup: guardian-deck-invalid-creation
    emptyExamine: guardian-deck-used-examine
    usedSound: /Audio/Effects/guardian_deck_shuffle.ogg

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxHoloparasite
  name: коробка голопаразита
  description: Коробка з інжектором голопаразита, а також аксесуаром.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: HoloparasiteInjector
        - id: HoloparasiteInfo
        - id: ClothingHeadHatBizarreSoft
  - type: Sprite
    layers:
      - state: box
      - state: holo

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxHoloclown
  name: коробка голоклоуна
  description: Коробка з інжектором голоклоуна, а також аксесуаром.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: HoloClownInjector
        - id: ToyFigurineHoloClown
        - id: ToyHammer
  - type: Sprite
    layers:
      - state: box_hug
      - state: holo
  - type: Tag
    tags:
    - BoxCardboard
    - BoxHug
