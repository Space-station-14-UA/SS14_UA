- type: entity
  parent: ClothingUniformBase
  id: UniformScrubsColorPurple
  name: фіолетовий медичний костюм
  description: Поєднання комфорту та практичності, створений для того, щоб процес вилучення абсолютно всіх органів у когось та їх продажу космічному роботу мав куди більш офіційний вигляд.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Scrubs/purple.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Scrubs/purple.rsi

