      - state: inhand-right
        color: "#004787"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#004787"
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#004787"
      belt:
      - state: equipped-BELT
        color: "#004787"
  - type: Fiber
    fiberColor: fibers-regal-blue

