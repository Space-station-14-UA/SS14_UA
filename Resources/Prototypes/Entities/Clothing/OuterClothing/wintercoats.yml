  name: зимове пальто
  description: Важке пальто з "синтетичного" хутра тварин.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/WinterCoats/coat.rsi
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.95
        Heat: 0.90
    priceMultiplier: 0
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.55
  - type: Tag
    tags:
