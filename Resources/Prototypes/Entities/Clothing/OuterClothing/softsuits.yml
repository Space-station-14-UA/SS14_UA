#Emergency EVA
- type: entity
  parent: [ TemperatureProtectionMinimal, ClothingOuterEVASuitBaseToggleable ]
  id: ClothingOuterSuitEmergency
  name: аварійний скафандр
  description: Цей громіздкий скафандр без термоізоляції явно не призначений для тривалого перебування у відкритому космосі, попри заяви NanoTrasen, що він відповідає корпоративним стандартам.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetEVALarge
  - type: Tag
    tags:
    - CorgiWearable
    - ScurretWearable
    - MonkeyWearable
    - WhitelistChameleon

