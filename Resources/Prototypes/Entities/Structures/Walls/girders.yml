- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: BaseGirder
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: InteractionOutline

- type: entity
  parent: [ BaseGirder, StructureHealthBarrier ]
  id: Girder
  name: балка
  description: Велика конструкція, виготовлена зі сталі. Для того, щоб вважатися стіною, потрібен додатковий шар сталі.
  components:
  - type: Construction
    graph: Girder
    node: girder
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
    state: wall_girder
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: StaticPrice
    price: 30

- type: entity
  parent: [ BaseGirder, StructureHealthBarrierWeak ]
  id: ReinforcedGirder
  name: армована балка
  description: Велика конструкція, виготовлена зі сталі та пласталі. Для того, щоб вважатися стіною, потрібен додатковий шар пласталі.
  components:
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
    state: reinforced_wall_girder
  - type: Construction
    graph: Girder
    node: reinforcedGirder
  - type: Damageable
    damageModifierSet: PlasteelStaticMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 0
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -4
      - !type:ChangeConstructionNodeBehavior
        node: girder
  - type: StaticPrice
    price: 130
