- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseWindoorAssembly
  name: збірка віконних дверей
  description: Вони відкриваються, зачиняються, і ви можете бачити крізь них!
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.2"
        density: 40
        mask:
        - Impassable
        - HighImpassable
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger: &DamageTrigger300
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: BaseWindoorAssembly
  id: WindoorAssembly
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/windoor.rsi
    layers:
    - state: assembly
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: &BaseWindoorDrop
            min: 1
            max: 3
  - type: Construction
    graph: Windoor
    node: assembly

- type: entity
  parent: BaseWindoorAssembly
  id: WindoorAssemblySecure
  name: збірка захищенних віконних дверей
  description: Вони відкриваються, зачиняються, і ви можете бачити крізь них! Виглядає міцно.
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/windoor.rsi
    layers:
    - state: secure_underlay
    - state: assembly
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1: *BaseWindoorDrop
  - type: Construction
    graph: Windoor
    node: assemblySecure

- type: entity
  parent: BaseWindoorAssembly
  id: WindoorAssemblyClockwork
  name: збірка годинникових віконних дверей
  description: Вони відкриваються, зачиняються, і ви можете бачити крізь них! Виглядає міцно.
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/clockwork_windoor.rsi
    layers:
    - state: open
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetBrass1: *BaseWindoorDrop
  - type: Construction
    graph: Windoor
    node: assemblyClockwork

