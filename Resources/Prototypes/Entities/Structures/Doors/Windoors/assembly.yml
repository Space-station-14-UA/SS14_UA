- type: entity
  parent: [ BaseStructure, StructureHealthDoorWeak ]
  id: WindoorAssembly
  name: збірка віконних дверей
  description: Вони відкриваються, зачиняються, і ви можете бачити крізь них!
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Doors/Windoors/windoor.rsi
    layers:
    - state: assembly
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.2"
        density: 40
        mask:
        - Impassable
        - HighImpassable
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Damageable
    damageModifierSet: SteelStaticMod
  - type: Destructible
    thresholds:
    - trigger: &DamageDoorWeak
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: &BaseWindoorDrop
            min: 1
            max: 2
  - type: Construction
    graph: Windoor
    node: assembly

#plasma windoor assemblies
- type: entity
  parent: WindoorAssembly
  id: WindoorAssemblyPlasma
  name: збірка плазмових віконних дверей
  description: Вони відкриваються, зачиняються, і ви можете бачити крізь них! Ці виглядають фіол-, ні, рожево. Зачекайте...
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/plasma.rsi
    layers:
    - state: assembly
  - type: Destructible
    thresholds:
    - trigger: *DamageDoorWeak
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPGlass1: *BaseWindoorDrop
  - type: Construction
    graph: Windoor
    node: pglass

#uranium windoor assemblies
- type: entity
  parent: WindoorAssembly
