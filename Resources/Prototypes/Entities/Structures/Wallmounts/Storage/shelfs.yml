    sprite: Structures/Storage/Shelfs/wood.rsi
    state: base
    layers:
    - state: rbase
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 2
            max: 5
  - type: Construction
    graph: Shelf
    node: ShelfRWood

- type: entity
  parent: ShelfBaseReinforced
  id: ShelfRMetal
  name: міцна металева полиця
  description: Міцне та блискуче місце для зберігання всіх ваших пляшок у безпеці.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/metal.rsi
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 2
            max: 3
          ShardGlass:
            min: 1
            max: 2
          PartRodMetal1:
            min: 1
            max: 2
  - type: Construction
    graph: Shelf
    node: ShelfRMetal

- type: entity
  parent: ShelfBaseReinforced
  id: ShelfRGlass
  name: міцна скляна полиця
  description: Кришталево прозорі двері з армованого скла, щоб продемонструвати всі ваші вишукані пляшки, за які ви точно не продали улюблену тарганоміль колеги.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/glass.rsi
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 1
            max: 3
          ShardGlass:
            min: 1
            max: 2
          PartRodMetal1:
            min: 0
            max: 1
  - type: Construction
    graph: Shelf
    node: ShelfRGlass

# Departmental
- type: entity
  parent: ShelfBase
  id: ShelfBar
  name: барна полиця
  description: Виготовлені з найкращої синтетичної деревини для всіх потреб зберігання алкоголю.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/Departments/Service/bar.rsi
    state: base
    layers:
      - state: base
      - state: bar-0
      - map: ["enum.StorageFillLayers.Fill"]
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 13
    fillBaseName: bar
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 4
  - type: Storage
    grid:
    - 0,0,5,1
    - 0,3,5,4
  - type: Construction
    graph: Shelf
    node: ShelfBar

