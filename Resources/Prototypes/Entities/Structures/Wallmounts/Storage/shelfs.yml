# Parents
- type: entity
  abstract: true
  parent: BaseWallmount
  id: ShelfBase
  name: полиця
  description: Дивне місце для розміщення, ну, чого завгодно. Ви відчуваєте, що не повинні бачити цього.
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Storage/Shelfs/wood.rsi
    state: base
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: &DamageTrigger50
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Storage
    grid:
    - 0,0,3,1
    - 0,3,3,4
    maxItemSize: Normal
  - type: UserInterface
    interfaces:
     enum.StorageUiKey.Key:
      type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container

- type: entity
  abstract: true
  parent: ShelfBase
  id: ShelfBaseReinforced
  name: армована полиця
  description: Вона виглядає такою ж сильною, як і сама реальність.
  components:
  - type: Lock
  - type: LockedStorage
  - type: LockVisuals
  - type: Sprite
    sprite: Structures/Storage/Shelfs/wood.rsi
    state: base
    layers:
    - state: rbase
      map: ["enum.StorageVisualLayers.Base"]
    - state: unlocked
      shader: unshaded
      # used to keep the unlocked light visible while open.
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
  - type: Appearance
  - type: EntityStorageVisuals
    stateDoorOpen: open
    stateDoorClosed: closed
  - type: AccessReader

# Normal
- type: entity
  parent: ShelfBase
  id: ShelfWood
  name: дерев'яна полиця
  description: Зручне місце, щоб розмістити, ну, що завгодно.
  components:
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 3
  - type: Tag
    tags:
    - Structure
    - Wooden
  - type: Construction
    graph: Shelf
    node: ShelfWood

- type: entity
  parent: ShelfBase
  id: ShelfMetal
  name: металева полиця
  description: Міцне місце, де можна розмістити, ну, що завгодно.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/metal.rsi
    state: base
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
  - type: Construction
    graph: Shelf
    node: ShelfMetal

- type: entity
  parent: ShelfBase
  id: ShelfGlass
  name: скляна полиця
  description: крихке місце, щоб розмістити, ну, що завгодно.
  components:
  - type: Sprite
    sprite: Structures/Storage/Shelfs/glass.rsi
    state: base
  - type: Damageable
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 0
            max: 2
  - type: Construction
    graph: Shelf
    node: ShelfGlass

