  id: SurveillanceCameraAssembly
  name: камера
  description: Камера спостереження. Не схоже, що найближчим часом вона буде за кимось спостерігати. Напевно.
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/camera.rsi
    layers:
    - state: camera_off
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds: *ThresholdsSurveilCamera
  - type: Construction
