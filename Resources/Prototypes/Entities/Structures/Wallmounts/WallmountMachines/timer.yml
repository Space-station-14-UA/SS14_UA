- type: entity
  parent: [ BaseWallmountMachine, StructureHealthMachineFlimsy ]
  id: SignalTimer
  name: сигнальний таймер
  description: Це таймер. Створений для надсилання сигналів іншим пристроям з затримкою.
  components:
  - type: StationAiWhitelist
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/switch.rsi
    state: on
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Rotatable
  - type: SignalTimer
    canEditLabel: false
  - type: DeviceLinkSource
    ports:
      - Start
      - Timer
  - type: DeviceLinkSink
    ports:
      - Trigger
  - type: ActivatableUI
    key: enum.SignalTimerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SignalTimerUiKey.Key:
        type: SignalTimerBoundUserInterface
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: ActivatableUIRequiresPower
  - type: Construction
    graph: Timer
    node: signal
    containers:
    - board
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: ContainerFill
    containers:
      board: [ SignalTimerElectronics ]

- type: entity
  id: ScreenTimer
  parent: SignalTimer
  name: таймер з екраном
  description: Це таймер з екраном. Створений для надсилання сигналів іншим пристроям з затримкою. Також, здатен відображати залишившийся час та текст за допомогою екрана!
  components:
  - type: SignalTimer
    canEditLabel: true
  - type: TextScreenTimerVisuals
    runningState: running
    finishedState: finished
  - type: TextScreenVisuals
    color: FloralWhite
    scrollEnabled: true
    rowData: [{}]
    horizontalScrollOffset: 1
    leftInvisiblePixels: 2
    rightInvisiblePixels: 1
    maxScrollingCharacters: 16
    frameState:
      state: outer_frame
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/signalscreen.rsi
    layers:
    - state: signalscreen
    - state: finished
      shader: unshaded
      map: [ enum.TimerVisualLayers.Light ]
    # noRot: true # TODO From an accessibility standpoint, screens with text shouldn't be rotatable; Mapping Lead already have concerns about this.
  - type: Construction
    graph: Timer
    node: screen
    containers:
    - board
  - type: ContainerFill
    containers:
      board: [ ScreenTimerElectronics ]

- type: entity
  id: BrigTimer
  parent: ScreenTimer
  name: таймер брігу
  description: Це таймер з екраном. Призначений спеціально для камер ув'язнення.
  components:
  - type: AccessReader
    access: [["Security"]]
  - type: Construction
    graph: Timer
    node: brig
    containers:
    - board
  - type: ContainerFill
    containers:
      board: [ BrigTimerElectronics ]

# Construction Frame

- type: entity
  id: TimerFrame
  name: рамка таймеру
  description: Це залізна рама для таймеру з екраном.
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/signalscreen.rsi
    state: signalscreen
  - type: Construction
    graph: Timer
    node: frame
  - type: WallMount
    arc: 360
