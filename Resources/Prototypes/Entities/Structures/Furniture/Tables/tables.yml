  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger: *DamageFurnitureNormal
      behaviors:
      - *SoundMetalBreak
      - *ChangeNodeFrame
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1
          SheetPlasteel1:
            min: 0
            max: 1
  - type: IconSmooth
    key: metalreinforcedtable
  - type: Construction
    graph: Table
    node: TableReinforced
  - type: Climbable
