
#region Frames

- type: entity
  parent: [ BaseStructure, StructureHealthFurnitureWeak ]
  id: TableFrame
  # BaseStructure and not BaseTable, since these shouldn't be climbable/placeable.
  name: каркас столу
  description: Шматки металу, з яких складається каркас столу.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/frame.rsi
  - type: Icon
    sprite: Structures/Furniture/Tables/frame.rsi
    state: full
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,-0.30,0.40,0.45"
        density: 80
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: IconSmooth
    key: state
    base: state_
  - type: Damageable
    damageModifierSet: RodMetalMod
  - type: Destructible
    thresholds:
    - trigger: &DamageFurnitureWeak
        !type:DamageTrigger
        damage: 5
      behaviors:
      - &SoundMetalBreak !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 1
            max: 1
  - type: Construction
    graph: Table
    node: TableFrame

- type: entity
  parent: [ BaseStructure, StructureHealthFurnitureWeak ]
  id: CounterWoodFrame
  name: каркас дерев'яного прилавку
  description: Шматки дерева, з яких складається каркас столу.
  components:
  - type: SpriteFade
  - type: Sprite
    sprite: Structures/Furniture/Tables/frame.rsi
  - type: Icon
    sprite: Structures/Furniture/Tables/frame.rsi
    state: full
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Damageable
    damageModifierSet: WoodMod
  - type: IconSmooth
    key: state
    base: state_
  - type: Destructible
    thresholds:
    - trigger: *DamageFurnitureWeak
      behaviors:
      - &SoundWoodDestroy !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1
  - type: Construction
    graph: Table
    node: CounterWoodFrame

- type: entity
  parent: [ BaseStructure, StructureHealthFurnitureWeak ]
  id: CounterMetalFrame
  name: каркас металевого прилавку
  description: Шматки металу, з яких складається каркас столу.
