- type: entity
  parent: BaseTree
  id: DecoratedFirTree
  name: прикрашена ялинка
  description: Дуже святкове дерево для дуже святкового свята.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/decorated_fir_tree.rsi
    layers:
      - state: base
      - state: balls
      - state: lights
        shader: unshaded
  - type: PointLight
    radius: 1.6
    energy: 2.0
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    offset: "0, 0.6"
