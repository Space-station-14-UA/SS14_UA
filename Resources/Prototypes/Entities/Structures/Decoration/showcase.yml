- type: entity
  id: BaseShowcaseRobot
  abstract: true
  parent: BaseStructure
  name: вітрина з охоронним роботом
  description: Нефункціональна копія старого робота-охоронця.
  components:
  - type: Anchorable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 5
            max: 10
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: ShowcaseRobot
  parent: BaseShowcaseRobot
  name: вітрина з охоронним роботом
  description: Нефункціональна копія старого робота-охоронця.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_1

- type: entity
  id: ShowcaseRobotWhite
  parent: BaseShowcaseRobot
  name: вітрина з білим роботом
  description: Нефункціональна копія старого робота.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_2

- type: entity
  id: ShowcaseRobotAntique
  parent: BaseShowcaseRobot
  name: вітрина з вантажним роботом
  description: Нефункціональна копія старого робота Карго.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_3

- type: entity
  id: ShowcaseRobotMarauder
  parent: BaseShowcaseRobot
  name: вітрина з мародером
  description: Нефункціональна копія мародера, пофарбована в зелений колір.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_4
