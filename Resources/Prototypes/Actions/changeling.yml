- type: entity
  parent: BaseAction
  id: ActionRetractableItemArmBlade
  name: Клинок із руки
  description: Скинути свою плоть та перетворити її на м'ясистий клинок.
  components:
  - type: Action
    useDelay: 2
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling.rsi
    layers:
    - state: armblade
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: ArmBlade
    summonSounds:
      collection: gib # Placeholder
    retractSounds:
      collection: gib # Placeholder

- type: entity
  parent: BaseAction
  id: ActionChangelingBiodegrade
  name: Біодеградація
  description: "Заблювати кислотою свої кайдани, звільнивши себе. \n\nПотребує 20 Хімікатів."
  components:
  - type: Action
    useDelay: 10
    raiseOnAction: true
    checkCanInteract: false
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: biodegrade
  - type: ActionRequireSatiation
    satiation: Chemicals
    amount: 20
    failReason: changeling-not-enough-chemicals
  - type: InstantAction
    event: !type:ChangelingBiodegradeActionEvent
  - type: ChangelingBiodegradeAbility

- type: entity
  id: ActionChangelingDevour
  name: "[color=red]Поглинути[/color]"
  description: Поглинути сутність своїх жертв та включити їхню особистість і розум у свої власні.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: 1
  - type: Sprite
    sprite: Interface/Actions/changeling.rsi
    layers:
    - state: "devour"
      map: ["enum.ActionVisuals.Icon"]
    - state: "devour_on"
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: ActionRequireMouthUncovered
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:ChangelingDevourActionEvent

- type: entity
  id: ActionChangelingTransform
  name: "[color=red]Трансформуватися[/color]"
  description: Перетворитися та прийняти особистості тих, кого ви поглинули.
  components:
  - type: Action
  - type: Sprite
    sprite: Interface/Actions/changeling.rsi
    layers:
    - state: "transform"
  - type: InstantAction
    event: !type:ChangelingTransformActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionChangelingStasis
  name: "[color=red]Увійти в стазис[/color]"
  description: Увійти в регенеративний стазис, прикидаючись мертвим та відновлюючи всі ушкодження.
  components:
  - type: Sprite
    sprite: Interface/Actions/changeling.rsi
    layers:
    - state: "stasis_enter"
      map: [ "enum.ActionVisuals.Icon" ]
    - state: "stasis_exit"
      map: [ "enum.ActionVisuals.IconToggled" ]
      visible: false
  - type: Action
    raiseOnAction: true
    useDelay: 2
    checkCanInteract: false # You can heal even if you are killed
    checkConsciousness: false
  - type: ConfirmableAction
    popup: suicide-regen-action-popup
    confirmWhenToggled: false
  - type: RegenerativeStasisAction
    bonusCooldownPerDamage: 0.675 # Bonus 135s (total 180s) at 200 damage
    minStasisCooldown: 45
    maxStasisCooldown: 180
  - type: InstantAction
    event: !type:ChangelingStasisActionEvent

- type: entity
  parent: ActionChangelingStasis
  id: ActionChangelingStasisWeak
  components:
  - type: RegenerativeStasisAction
    bonusCooldownPerDamage: 1.2 # 50 damage should bring you to 120
    minStasisCooldown: 60
    maxStasisCooldown: 120

- type: entity
  parent: ActionIntrinsicStore
  id: ActionChangelingStore
  name: Магазин ДНК
  description: Відкриває магазин здібностей.
  components:
  - type: Action
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: "shop"

- type: entity
  parent: BaseAction
  id: ActionChangelingVoiceMimic
  name: Імітація голосу
  description: Змінити голосові зв'язки, щоб імітувати чужий голос.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: mimicry
  - type: InstantAction
    event: !type:VoiceMaskSetNameEvent

- type: entity
  parent: BaseAction
  id: ActionChangelingStingDna
  name: Витягти ДНК
  description: "Потайки поглинути особистість нічого не підозрюючих жертв. Не дає ДНК у ваш магазин та не просуває цілі. \n\nПотребує 50 Хімікатів."
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: 1
    useDelay: 20
    raiseOnUser: true
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: "extract_dna_off"
      map: ["enum.ActionVisuals.Icon"]
    - state: "extract_dna_on"
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: ActionRequireSatiation
    satiation: Chemicals
    amount: 50
    failReason: changeling-not-enough-chemicals
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:ChangelingStingDnaEvent
  - type: PopupOnAction
    popupType: Medium
    selfMessage: changeling-sting-success

- type: entity
  abstract: true
  parent: BaseAction
  id: BaseActionChangelingSting
  components:
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Bloodstream
    event: !type:EntityEffectActionEvent
  - type: ActionRequireSatiation
    satiation: Chemicals
    amount: 30
    failReason: changeling-not-enough-chemicals
  - type: PopupOnAction
    popupType: Medium
    selfMessage: changeling-sting-success

- type: entity
  parent: BaseActionChangelingSting
  id: ActionChangelingStingBlind
  name: Осліплююче жало
  description: "Безшумно вжалити ціль та погіршити її зір на короткий час. \n\nПотребує 30 Хімікатів."
  components:
  - type: Action
    useDelay: 30
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: blind_sting
  - type: EntityEffectAction
    effects:
    - !type:AddReagentToBloodstream
      reagent: NorepinephricAcid
      quantity: 23

- type: entity
  parent: BaseActionChangelingSting
  id: ActionChangelingStingCryogenic
  name: Кріогенне жало
  description: "Безшумно вжалити ціль та значно уповільнити її пересування. \n\nПотребує 30 Хімікатів."
  components:
  - type: Action
    useDelay: 10
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: cryogenic_sting
  - type: EntityEffectAction
    effects:
    - !type:AddReagentToBloodstream
      reagent: Fresium
      quantity: 10 # About 20 seconds of slowdown.

- type: entity
  parent: BaseActionChangelingSting
  id: ActionChangelingStingLead
  name: Смертоносне жало
  description: "Безшумно вжалити ціль та ввести їй смертельну дозу повільнодіючої отрути. \n\nПотребує 50 Хімікатів."
  components:
  - type: Action
    useDelay: 60
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: lethal_sting
  - type: ActionRequireSatiation
    amount: 50
  - type: EntityEffectAction
    effects:
    - !type:AddReagentToBloodstream
      reagent: Lead
      quantity: 5 # Exactly 100 poison damage over 3 minutes.

- type: entity
  parent: BaseActionChangelingSting
  id: ActionChangelingStingHallucinogenic
  name: Галюциногенне жало
  description: "Безшумно вжалити ціль та ввести хімікати, що уповільнюють вищі функції мозку. \n\nПотребує 30 Хімікатів."
  components:
  - type: Action
    useDelay: 10
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: hallucination_sting
  - type: EntityEffectAction
    effects:
    - !type:AddReagentToBloodstream
      reagent: SpaceDrugs
      quantity: 10 # About 100s of being high
    - !type:AddReagentToBloodstream
      reagent: Cryptobiolin
      quantity: 10 # About 20s of your speech being scrambled

- type: entity
  parent: BaseActionChangelingSting
  id: ActionChangelingStingMute
  name: Жало німоти
  description: "Безшумно вжалити ціль та ввести хімікати, що заважають їй говорити. \n\nПотребує 30 Хімікатів."
  components:
  - type: Action
    useDelay: 30
    raiseOnAction: true
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: mute_sting
  - type: EntityEffectAction
    effects:
    - !type:AddReagentToBloodstream
      reagent: TaciticAcid
      quantity: 5 # 50s of imperceptible mute

- type: entity
  parent: BaseAction
  id: ActionChangelingLastResort
  name: "[color=red]Крайній засіб[/color]"
  description: Ми жертвуємо поточним тілом у момент потреби, жорстоко розширюючись, щоб пробитися крізь перешкоди, і відновлюємося у формі слимака.
  components:
  - type: ConfirmableAction
    popup: suicide-action-popup
  - type: Action
    raiseOnAction: true
    checkCanInteract: false # You can transform if you are killed
    checkConsciousness: false
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: last_resort
  - type: InstantAction
    event: !type:ChangelingLastResortActionEvent
  - type: ChangelingLastResortAbility

- type: entity
  parent: BaseAction
  id: ActionChangelingTakeOverCorpse
  name: Захопити труп
  description: Заразити труп, щоб повернутися до своєї справжньої форми.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: take_over_corpse
  - type: EntityTargetAction
    event: !type:ChangelingTakeOverCorpseActionEvent
  - type: TargetAction

- type: entity
  parent: ActionToggleNightVision
  id: ActionChangelingNightVision
  name: Перемикнути нічне бачення
  description: Вмикає або вимикає наше нічне бачення.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: nv_on

- type: entity
  parent: BaseAction
  id: ActionChangelingScreech
  name: Вереск
  description: Ми видаємо оглушливий вереск, який ослаблює всіх довкола.
  components:
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: screech
  - type: Action
    useDelay: 60 # unbalanced :godo:
    raiseOnAction: true
  - type: ScreechAction
    effects:
    - !type:MovementSpeedModifier
      walkSpeedModifier: 0.5
      sprintSpeedModifier: 0.5
      time: 5
    - !type:Disarm
    - !type:ModifyKnockdown
      probability: 0.5
  - type: InstantAction
    event: !type:ScreechActionEvent

- type: entity
  parent: FakeMindShieldToggleAction
  id: ActionChangelingFakeMindshieldToggle
  name: '[color=green]Перемикнути фальшивий захист розуму[/color]'
  description: Увімкнути або вимкнути видимість нашого захисту розуму.
  components:
  - type: Sprite
    sprite: Interface/Actions/changeling2.rsi
    layers:
    - state: mindshield_off
      map: ["enum.ActionVisuals.Icon"]
    - state: mindshield_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:FakeMindShieldToggleEvent
      actionTag: FakeMindShieldChangeling
  - type: Tag
    tags:
    - FakeMindShieldChangeling # used to distinguish the changeling's toggle mindshield action from the implant's
